<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כניסה: הקוד מהמייל</title>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:#24505f}a:hover{color:#2b2420}
</style>
</head>
<body>



<div class="tp" dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1d2427; font-size: 15px; line-height: 22px;">
  <div class="photo" role="img" aria-label="תמונת הסטודיו" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 36%; filter: blur(14px) saturate(1.1); transform: scale(1.12);">תמונת הסטודיו</div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(245,244,242,0.35);"></div>

  <header style="position: absolute; top: 56px; inset-inline: 20px; display: flex; align-items: center; justify-content: space-between;">
    <a class="glass" href="Main.html" aria-label="חזרה" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #2b2420;">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <span class="mark" style="width: 44px; height: 44px; border-radius: 14px;">
      <svg class="icon" viewBox="0 0 48 48" style="width: 26px; height: 26px; stroke-width: 3.4;" aria-hidden="true"><path d="M8 28c5-7 9-7 13 0s8 7 13 0 7-6 6-4"></path><path d="M10 19c4-4 7-4 11 0"></path></svg>
    </span>
  </header>

  <section class="glass" style="position: absolute; top: 150px; inset-inline: 16px; padding: 30px 22px 24px; border-radius: 30px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span class="chip chip-brand" style="align-self: flex-start;">
        <svg class="icon" viewBox="0 0 24 24" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M4 6h16v12H4z"></path><path d="M4 7l8 6 8-6"></path></svg>
        נשלח מייל
      </span>
      <h1 class="serif" style="font-size: 30px; line-height: 36px; font-weight: 400;">הקוד בדרך אלייך</h1>
      <p style="color: #5e544c;">שלחנו קוד של 6 ספרות אל <bdi dir="ltr">noga@example.com</bdi>. הוא בתוקף ל-10 דקות.</p>
    </div>
    <div dir="ltr" role="group" aria-label="קוד הכניסה" style="display: flex; justify-content: space-between; gap: 8px;">
      <span class="digit">4</span><span class="digit">8</span><span class="digit">1</span><span class="digit digit--on">2</span><span class="digit"></span><span class="digit"></span>
    </div>
    <p style="font-size: 13px; color: #5e544c;">בטלפון הקוד מופיע מעל המקלדת, ולוחצים עליו.</p>
    <button class="btn btn-brand" type="button">כניסה לסטודיו</button>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button class="btn btn-ghost" type="button" style="width: auto; padding: 0 4px;">שליחה מחדש בעוד 0:42</button>
      <a href="#" style="font-size: 14px; font-weight: 600;">כניסה עם סיסמה</a>
    </div>
  </section>

  <section class="glass" style="position: absolute; bottom: 34px; inset-inline: 16px; padding: 16px 18px; border-radius: 22px; display: flex; gap: 12px; align-items: center;">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #dfeaee; color: #24505f; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path><path d="M9 9v1M15 9v1M12 9v4h-1M9.5 16c1.5 1 3.5 1 5 0"></path></svg>
    </span>
    <p style="font-size: 14px; line-height: 20px; color: #2b2420;">אחרי הכניסה נציע <bdi>Face ID</bdi>, ובפעם הבאה נכנסים במבט אחד.</p>
  </section>
</div>
</body>
</html>
