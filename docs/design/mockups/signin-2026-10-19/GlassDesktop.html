<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כניסה במחשב: זכוכית על הסטודיו</title>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:#24505f}a:hover{color:#2b2420}
</style>
</head>
<body>



<div class="tp" dir="rtl" lang="he" style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #1d2427; font-size: 15px; line-height: 22px;">
  <div class="photo" role="img" aria-label="הסטודיו של נשימה, חדר רפורמרים מואר" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%;">תמונת הסטודיו</div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(270deg, rgba(20,26,29,0) 40%, rgba(20,26,29,0.42) 100%);"></div>

  <header style="position: absolute; top: 32px; inset-inline: 40px; display: flex; align-items: center; justify-content: space-between;">
    <div class="glass-dark" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 10px 0 18px; border-radius: 999px;">
      <span class="mark" style="width: 36px; height: 36px; border-radius: 12px;">
        <svg class="icon" viewBox="0 0 48 48" style="width: 22px; height: 22px; stroke-width: 3.4;" aria-hidden="true"><path d="M8 28c5-7 9-7 13 0s8 7 13 0 7-6 6-4"></path><path d="M10 19c4-4 7-4 11 0"></path></svg>
      </span>
      <span style="font-size: 16px; font-weight: 600;">סטודיו נשימה</span>
    </div>
  </header>

  <div style="position: absolute; bottom: 56px; inset-inline-end: 56px; color: #fff; max-width: 420px; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 600; opacity: 0.9;">השיעור הבא</span>
    <p class="serif" style="font-size: 40px; line-height: 46px; font-weight: 300;">רפורמר זרימה עם מאיה, היום ב-18:30</p>
  </div>

  <section class="glass" style="position: absolute; top: 112px; inset-inline-start: 72px; width: 420px; padding: 36px 32px 30px; border-radius: 32px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 class="serif" style="font-size: 38px; line-height: 44px; font-weight: 400;">ברוכה הבאה לנשימה</h1>
      <p style="color: #5e544c;">כניסה או הצטרפות, באותו מקום. בלי סיסמה.</p>
    </div>
    <div class="field">
      <label for="d-email">כתובת מייל</label>
      <input id="d-email" class="input input--focus" type="email" value="noga@example.com" dir="ltr" style="text-align: right;">
    </div>
    <button class="btn btn-brand" type="button">שלחו לי קוד כניסה</button>
    <div style="display: flex; align-items: center; gap: 12px; color: #776a5f; font-size: 13px;"><span style="flex: 1; height: 1px; background: rgba(43,36,32,0.14);"></span>או<span style="flex: 1; height: 1px; background: rgba(43,36,32,0.14);"></span></div>
    <button class="btn btn-paper" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3"></path><path d="M5 11h14v9H5z"></path><path d="M12 15v2"></path></svg>
      כניסה עם מפתח גישה
    </button>
    <p class="built">נבנה עם <bdi>Tempo</bdi> · <a href="#">תנאי שימוש ופרטיות</a></p>
  </section>
</div>
</body>
</html>
