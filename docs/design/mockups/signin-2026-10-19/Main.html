<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כניסה: זכוכית על הסטודיו</title>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:#24505f}a:hover{color:#2b2420}
</style>
</head>
<body>



<div class="tp" dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1d2427; font-size: 15px; line-height: 22px;">
  <div class="photo" role="img" aria-label="הסטודיו של נשימה, חדר רפורמרים מואר" style="position: absolute; inset: 0 0 auto 0; width: 100%; height: 560px; object-fit: cover; object-position: 50% 36%;">תמונת הסטודיו</div>
  <div aria-hidden="true" style="position: absolute; inset: 0 0 auto 0; height: 560px; background: linear-gradient(180deg, rgba(20,26,29,0.45) 0%, rgba(20,26,29,0) 34%, rgba(20,26,29,0) 62%, rgba(20,26,29,0.5) 100%);"></div>

  <header style="position: absolute; top: 56px; inset-inline: 20px; display: flex; align-items: center; justify-content: space-between;">
    <div class="glass-dark" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 16px; border-radius: 999px;">
      <span class="mark" style="width: 34px; height: 34px; border-radius: 11px;">
        <svg class="icon" viewBox="0 0 48 48" style="width: 22px; height: 22px; stroke-width: 3.4;" aria-hidden="true"><path d="M8 28c5-7 9-7 13 0s8 7 13 0 7-6 6-4"></path><path d="M10 19c4-4 7-4 11 0"></path></svg>
      </span>
      <span style="font-size: 15px; font-weight: 600;">סטודיו נשימה</span>
    </div>
    <span class="glass-dark" style="height: 32px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600;">תל אביב</span>
  </header>

  <div style="position: absolute; top: 404px; inset-inline: 24px; color: #fff;">
    <p style="font-size: 13px; font-weight: 600; opacity: 0.9;">השיעור הבא: רפורמר זרימה, היום ב-18:30</p>
  </div>

  <section class="glass" style="position: absolute; bottom: 0; inset-inline: 0; padding: 28px 22px 26px; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 class="serif" style="font-size: 32px; line-height: 38px; font-weight: 400;">ברוכה הבאה לנשימה</h1>
      <p style="color: #5e544c;">כניסה או הצטרפות, באותו מקום. בלי סיסמה.</p>
    </div>
    <div class="field">
      <label for="email">כתובת מייל</label>
      <input id="email" class="input input--focus" type="email" value="noga@example.com" dir="ltr" style="text-align: right;">
    </div>
    <a class="btn btn-brand" href="GlassCode.html">שלחו לי קוד כניסה</a>
    <button class="btn btn-paper" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path><path d="M9 9v1M15 9v1M12 9v4h-1M9.5 16c1.5 1 3.5 1 5 0"></path></svg>
      כניסה עם <bdi>Face ID</bdi>
    </button>
    <p class="built">נבנה עם <bdi>Tempo</bdi> · <a href="#">תנאי שימוש ופרטיות</a></p>
  </section>
</div>
</body>
</html>
