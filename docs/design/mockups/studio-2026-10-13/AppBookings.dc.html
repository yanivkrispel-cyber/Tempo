<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ההזמנות שלי · אפליקציית המתאמן</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tempo/tokens.css">
<link rel="stylesheet" href="ds/tempo/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:var(--brand-ink)}a:hover{color:var(--ink)}
a.tp-tabbar__item,a.tp-tabbar__fab{text-decoration:none}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:58px;border-radius:12px;flex:none;font-weight:700;font-size:16px;line-height:20px;background:var(--surface-sunken);box-shadow:var(--shadow-sunken)}
.slot small{font-size:11px;line-height:14px;font-weight:600;color:var(--ink-muted)}
</style>
</helmet>
<div dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px;">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 16px;">
    <header style="display: flex; flex-direction: column; gap: 2px;">
      <span class="tp-eyebrow">נגה רוזן</span>
      <h1 style="font-size: 28px; font-weight: 800;">ההזמנות שלי</h1>
    </header>

    <div class="tp-tabs" role="tablist" aria-label="הזמנות" style="width: 100%; box-sizing: border-box;">
      <button class="tp-tab" role="tab" type="button" aria-selected="{{tUp}}" onClick="{{showUp}}" style="flex: 1;">קרובים · 3</button>
      <button class="tp-tab" role="tab" type="button" aria-selected="{{tPast}}" onClick="{{showPast}}" style="flex: 1;">היסטוריה</button>
    </div>

    <sc-if value="{{isUp}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <sc-for list="{{upcoming}}" as="b" hint-placeholder-count="3">
          <a class="tp-class" href="AppClass.dc.html" style="padding: 14px; gap: 14px; color: var(--ink); text-decoration: none;">
            <span class="slot">{{b.time}}<small>{{b.day}}</small></span>
            <span class="tp-class__body">
              <span class="tp-class__title" style="font-size: 16px; line-height: 22px;">{{b.title}}</span>
              <span class="tp-class__meta" style="font-size: 13px;">{{b.meta}}</span>
            </span>
            <span class="{{b.chip}}">{{b.state}}</span>
          </a>
        </sc-for>
        <div class="tp-banner" role="note" style="font-size: 14px;">
          <svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span>כשמתפנה מקום בשיעור שאת ממתינה לו, נרשום אותך אוטומטית ונשלח התראה.</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isPast}}" hint-placeholder-val="{{false}}">
      <div class="tp-table-wrap" style="padding: 4px;">
        <table class="tp-table tp-table--compact">
          <thead><tr><th>שיעור</th><th>תאריך</th><th>מצב</th></tr></thead>
          <tbody>
            <sc-for list="{{past}}" as="p" hint-placeholder-count="6">
              <tr><td>{{p.title}}</td><td class="tp-muted">{{p.date}}</td><td><span class="{{p.chip}}">{{p.state}}</span></td></tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </sc-if>
  </div>

  <nav class="tp-tabbar" aria-label="ניווט" style="position: absolute; bottom: 16px; inset-inline: 16px;">
    <a class="tp-tabbar__item" href="AppHome.dc.html"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>בית</a>
    <a class="tp-tabbar__item" href="AppBook.dc.html"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>מערכת</a>
    <a class="tp-tabbar__fab" href="AppBook.dc.html" aria-label="הרשמה לשיעור"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a class="tp-tabbar__item" href="AppBookings.dc.html" aria-current="page"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>הזמנות</a>
    <a class="tp-tabbar__item" href="AppProfile.dc.html"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>פרופיל</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'up' }; }
  renderVals() {
    const t = this.state.tab;
    const upcoming = [
      ['17:30', 'היום', 'פילאטיס מכשירים', 'דנה · חדר המכשירים', 'רשומה', 'tp-chip tp-chip--success'],
      ['18:00', 'רביעי', 'פילאטיס כוח', 'עומר · האולם הגדול', 'מקום 2 בהמתנה', 'tp-chip tp-chip--warning'],
      ['07:00', 'חמישי', 'ויניאסה יוגה', 'נועה · האולם הגדול', 'רשומה', 'tp-chip tp-chip--success']
    ].map(([time, day, title, meta, state, chip]) => ({ time, day, title, meta, state, chip }));
    const past = [
      ['פילאטיס מכשירים', '12.10', true], ['יין יוגה', '11.10', true], ['ויניאסה יוגה', '08.10', true],
      ['פילאטיס מכשירים', '06.10', false], ['פילאטיס מזרן', '05.10', true], ['פילאטיס מכשירים', '01.10', true]
    ].map(([title, date, ok]) => ({ title, date, state: ok ? 'הגעת' : 'בוטל בזמן', chip: ok ? 'tp-chip tp-chip--success' : 'tp-chip tp-chip--plain' }));
    return {
      upcoming, past, isUp: t === 'up', isPast: t === 'past', tUp: String(t === 'up'), tPast: String(t === 'past'),
      showUp: () => this.setState({ tab: 'up' }), showPast: () => this.setState({ tab: 'past' })
    };
  }
}
</script>
</body>
</html>
