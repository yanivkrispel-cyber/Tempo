<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מערכת שבועית</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tempo/tokens.css">
<link rel="stylesheet" href="ds/tempo/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:var(--brand-ink)}a:hover{color:var(--ink)}
a.tp-event{text-decoration:none;color:var(--ink)}
</style>
</helmet>
<div dir="rtl" lang="he" style="min-height: 1080px; box-sizing: border-box; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px;">

  <nav class="tp-rail" aria-label="ניווט ראשי" style="flex: none;">
    <div class="tp-rail__logo">T</div>
    <a class="tp-rail__item" href="Main.dc.html" aria-label="היום"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></a>
    <a class="tp-rail__item" href="Schedule.dc.html" aria-current="page" aria-label="מערכת שבועית"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></a>
    <a class="tp-rail__item" href="Members.dc.html" aria-label="מנויים"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></a>
    <a class="tp-rail__item" href="#" aria-label="הודעות"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="tp-chip tp-chip--count">2</span></a>
    <a class="tp-rail__item" href="#" aria-label="דוחות"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/></svg></a>
    <div class="tp-rail__spacer" style="min-height: 180px;"></div>
    <a class="tp-rail__item" href="#" aria-label="הגדרות"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></a>
    <span class="tp-avatar tp-avatar--taupe" style="margin-top: 8px;">מר</span>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; max-width: 1240px; display: flex; flex-direction: column; gap: 20px;">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="tp-eyebrow">שבוע 42 · 11.10 עד 17.10.2026</span>
        <h1>מערכת שבועית</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
        <button class="tp-btn tp-btn--icon" type="button" aria-label="השבוע הקודם"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        <button class="tp-btn tp-btn--secondary" type="button">היום</button>
        <button class="tp-btn tp-btn--icon" type="button" aria-label="השבוע הבא"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="tp-btn" type="button" onClick="{{openNew}}"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>שיעור חדש</button>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
      <div class="tp-seg" role="group" aria-label="סינון לפי מדריך.ה">
        <sc-for list="{{coaches}}" as="co" hint-placeholder-count="5">
          <button class="tp-seg__opt" type="button" aria-pressed="{{co.on}}" onClick="{{co.pick}}">{{co.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span class="tp-chip tp-chip--cat-sage">ויניאסה</span>
        <span class="tp-chip tp-chip--cat-rose">מכשירים</span>
        <span class="tp-chip tp-chip--cat-taupe">מזרן</span>
        <span class="tp-chip tp-chip--cat-amber">פילאטיס כוח</span>
        <span class="tp-chip tp-chip--cat-mauve">הריון</span>
        <span class="tp-chip tp-chip--cat-blue">יין</span>
      </div>
    </div>

    <section class="tp-sched" aria-label="שיעורי השבוע">
      <div class="tp-sched__head">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div class="{{d.headClass}}">{{d.name}} <b>{{d.num}}</b></div>
        </sc-for>
      </div>
      <div class="tp-sched__body">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div class="{{d.colClass}}" style="min-height: 640px;">
            <sc-for list="{{d.events}}" as="e" hint-placeholder-count="4">
              <a class="{{e.cls}}" href="ClassDetail.dc.html" style="--tp-fill: {{e.pct}};">
                <span class="tp-event__count">{{e.badge}}</span>
                <span class="tp-event__title" style="padding-inline-end: 40px;">{{e.title}}</span>
                <span class="tp-event__meta">{{e.time}} · {{e.coach}}</span>
                <span class="tp-event__meta">{{e.count}}</span>
                <span class="tp-event__fill"><i></i></span>
              </a>
            </sc-for>
            <sc-if value="{{d.empty}}" hint-placeholder-val="{{false}}">
              <div class="tp-caption" style="text-align: center; padding-top: 24px;">אין שיעורים</div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>
  </main>

  <sc-if value="{{showNew}}" hint-placeholder-val="{{false}}">
    <div class="tp-scrim">
      <div class="tp-dialog" role="dialog" aria-modal="true" aria-labelledby="new-h" style="max-width: 560px;">
        <h2 id="new-h" class="tp-dialog__title">שיעור חדש</h2>
        <p class="tp-dialog__body" style="margin-bottom: 20px;">השיעור יופיע מיד באפליקציה של המתאמנים.</p>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
          <div class="tp-field" style="grid-column: span 2;">
            <label class="tp-field__label" for="f-type">סוג שיעור</label>
            <select id="f-type" class="tp-select"><option>פילאטיס מכשירים</option><option>פילאטיס מזרן</option><option>ויניאסה יוגה</option><option>יין יוגה ונשימה</option><option>יוגה בהריון</option></select>
          </div>
          <div class="tp-field">
            <label class="tp-field__label" for="f-coach">מדריך.ה</label>
            <select id="f-coach" class="tp-select"><option>דנה</option><option>נועה</option><option>יעל</option><option>עומר</option></select>
          </div>
          <div class="tp-field">
            <label class="tp-field__label" for="f-room">חדר</label>
            <select id="f-room" class="tp-select"><option>חדר המכשירים</option><option>האולם הגדול</option></select>
          </div>
          <div class="tp-field">
            <label class="tp-field__label" for="f-date">תאריך</label>
            <input id="f-date" class="tp-input" defaultValue="15.10.2026">
          </div>
          <div class="tp-field">
            <label class="tp-field__label" for="f-time">שעת התחלה</label>
            <input id="f-time" class="tp-input" defaultValue="18:00">
          </div>
          <div class="tp-field">
            <label class="tp-field__label" for="f-len">משך</label>
            <select id="f-len" class="tp-select"><option>50 דקות</option><option>60 דקות</option><option>75 דקות</option></select>
          </div>
          <div class="tp-field">
            <label class="tp-field__label" for="f-cap">מקומות</label>
            <input id="f-cap" class="tp-input" defaultValue="8" inputmode="numeric">
            <span class="tp-field__help">חדר המכשירים מחזיק עד 8 מכשירים.</span>
          </div>
        </div>
        <label class="tp-toggle" style="margin-top: 12px;"><input type="checkbox" defaultChecked="{{yes}}"><span class="tp-toggle__track"></span><span class="tp-toggle__label">רשימת המתנה אוטומטית כשהשיעור מלא</span></label>
        <label class="tp-toggle"><input type="checkbox"><span class="tp-toggle__track"></span><span class="tp-toggle__label">שיעור קבוע בכל שבוע</span></label>
        <div class="tp-dialog__actions">
          <button class="tp-btn tp-btn--secondary" type="button" onClick="{{closeNew}}">ביטול</button>
          <button class="tp-btn" type="button" onClick="{{create}}">יצירת השיעור</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{created}}" hint-placeholder-val="{{false}}">
    <div class="tp-toast tp-toast--success" role="status" style="position: fixed; bottom: 24px; inset-inline-start: 50%; transform: translateX(50%); z-index: 50;">
      <span class="tp-toast__tile"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span>השיעור נוצר ונפתח להרשמה</span>
      <button class="tp-toast__close" type="button" aria-label="סגירה" onClick="{{closeToast}}"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { coach: 'all', showNew: false, created: false }; }
  renderVals() {
    const T = { vin: ['ויניאסה יוגה', 'sage'], ref: ['פילאטיס מכשירים', 'rose'], mat: ['פילאטיס מזרן', 'taupe'], pow: ['פילאטיס כוח', 'amber'], pre: ['יוגה בהריון', 'mauve'], yin: ['יין יוגה', 'blue'] };
    const raw = [
      [['07:00', 'vin', 'נועה', 10, 14], ['09:30', 'ref', 'דנה', 8, 8], ['18:00', 'mat', 'יעל', 11, 12], ['19:30', 'ref', 'דנה', 6, 8], ['20:30', 'yin', 'עומר', 9, 14]],
      [['07:00', 'ref', 'דנה', 5, 8], ['12:00', 'mat', 'יעל', 7, 12], ['18:30', 'vin', 'נועה', 13, 14], ['19:45', 'pow', 'עומר', 8, 10]],
      [['07:00', 'vin', 'נועה', 12, 14], ['09:30', 'ref', 'דנה', 7, 8], ['12:00', 'mat', 'יעל', 9, 12], ['17:30', 'ref', 'דנה', 8, 8], ['19:00', 'pre', 'נועה', 6, 10], ['20:15', 'yin', 'עומר', 14, 14]],
      [['07:00', 'ref', 'דנה', 6, 8], ['09:30', 'vin', 'נועה', 8, 14], ['18:00', 'pow', 'עומר', 10, 10], ['19:30', 'mat', 'יעל', 4, 12]],
      [['07:00', 'vin', 'נועה', 5, 14], ['09:30', 'ref', 'דנה', 3, 8], ['18:30', 'ref', 'דנה', 2, 8], ['20:00', 'yin', 'עומר', 6, 14]],
      [['08:00', 'ref', 'דנה', 8, 8], ['09:30', 'vin', 'נועה', 11, 14], ['11:00', 'pre', 'נועה', 0, 10, true]],
      []
    ];
    const names = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
    const c = this.state.coach;
    const days = raw.map((evs, i) => {
      const events = evs.filter((e) => c === 'all' || e[2] === c).map(([time, k, coach, n, cap, cancelled]) => {
        const free = cap - n;
        return {
          time, coach, title: T[k][0],
          cls: cancelled ? 'tp-event tp-event--cancelled' : 'tp-event tp-event--' + T[k][1],
          pct: Math.round((n / cap) * 100) + '%',
          badge: cancelled ? 'בוטל' : free === 0 ? 'מלא' : free === 1 ? 'מקום אחד' : free + ' פנויים',
          count: cancelled ? 'המתאמנים קיבלו הודעה' : n + ' מתוך ' + cap + ' רשומים'
        };
      });
      return {
        name: names[i], num: String(11 + i), events, empty: events.length === 0,
        headClass: i === 2 ? 'tp-sched__day tp-sched__day--today' : 'tp-sched__day',
        colClass: i === 2 ? 'tp-sched__col tp-sched__col--today' : 'tp-sched__col'
      };
    });
    const coaches = [['all', 'כל הצוות'], ['דנה', 'דנה'], ['נועה', 'נועה'], ['יעל', 'יעל'], ['עומר', 'עומר']].map(([id, label]) => ({
      label, on: String(c === id), pick: () => this.setState({ coach: id })
    }));
    return {
      yes: true, days, coaches, showNew: this.state.showNew, created: this.state.created,
      openNew: () => this.setState({ showNew: true }),
      closeNew: () => this.setState({ showNew: false }),
      create: () => this.setState({ showNew: false, created: true }),
      closeToast: () => this.setState({ created: false })
    };
  }
}
</script>
</body>
</html>
