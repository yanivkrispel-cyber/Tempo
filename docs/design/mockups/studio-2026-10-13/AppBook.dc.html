<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מערכת והרשמה · אפליקציית המתאמן</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tempo/tokens.css">
<link rel="stylesheet" href="ds/tempo/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:var(--brand-ink)}a:hover{color:var(--ink)}
a.tp-tabbar__item,a.tp-tabbar__fab{text-decoration:none}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:58px;border-radius:12px;flex:none;font-weight:700;font-size:16px;line-height:20px;background:var(--surface-sunken);box-shadow:var(--shadow-sunken)}
.slot small{font-size:11px;line-height:14px;font-weight:600;color:var(--ink-muted)}
</style>
</helmet>
<div dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px;">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 16px;">
    <header style="display: flex; flex-direction: column; gap: 2px;">
      <span class="tp-eyebrow">סטודיו נשימה</span>
      <h1 style="font-size: 28px; font-weight: 800;">מערכת שיעורים</h1>
    </header>

    <div class="tp-seg" role="group" aria-label="יום" style="width: 100%; box-sizing: border-box;">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="4">
        <button class="tp-seg__opt" type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="flex: 1; padding-inline: 6px;">{{d.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px; overflow-x: auto; padding-block: 4px;">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button class="{{c.cls}}" type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="border: 0; cursor: pointer; min-height: 34px;">{{c.label}}</button>
      </sc-for>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div class="tp-class" style="padding: 14px; gap: 14px;">
        <span class="slot">{{r.time}}<small>{{r.len}}</small></span>
        <a class="tp-class__body" href="AppClass.dc.html" style="color: var(--ink); text-decoration: none;">
          <span class="tp-class__title" style="font-size: 16px; line-height: 22px;">{{r.title}}</span>
          <span class="tp-class__meta" style="font-size: 13px;">{{r.coach}} · {{r.spots}}</span>
        </a>
        <div class="tp-class__actions">
          <sc-if value="{{r.isBooked}}" hint-placeholder-val="{{false}}"><span class="tp-chip tp-chip--success">רשומה</span></sc-if>
          <sc-if value="{{r.isWaiting}}" hint-placeholder-val="{{false}}"><span class="tp-chip tp-chip--warning">{{r.waitLabel}}</span></sc-if>
          <sc-if value="{{r.canBook}}" hint-placeholder-val="{{true}}"><button class="tp-btn tp-btn--secondary tp-btn--sm" type="button" onClick="{{r.book}}">הרשמה</button></sc-if>
          <sc-if value="{{r.canWait}}" hint-placeholder-val="{{false}}"><button class="tp-btn tp-btn--ghost tp-btn--sm" type="button" onClick="{{r.wait}}" style="box-shadow: inset 0 0 0 1px var(--line);">להמתנה</button></sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <nav class="tp-tabbar" aria-label="ניווט" style="position: absolute; bottom: 16px; inset-inline: 16px;">
    <a class="tp-tabbar__item" href="AppHome.dc.html"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>בית</a>
    <a class="tp-tabbar__item" href="AppBook.dc.html" aria-current="page"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>מערכת</a>
    <a class="tp-tabbar__fab" href="AppBook.dc.html" aria-label="הרשמה לשיעור"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a class="tp-tabbar__item" href="AppBookings.dc.html"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>הזמנות</a>
    <a class="tp-tabbar__item" href="AppProfile.dc.html"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>פרופיל</a>
  </nav>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: var(--surface-overlay); backdrop-filter: blur(4px); display: flex; align-items: flex-end; z-index: 40;">
      <div class="tp-dialog" role="dialog" aria-modal="true" aria-labelledby="sh-h" style="padding: 24px 20px 28px;">
        <div class="tp-dialog__handle"></div>
        <h2 id="sh-h" class="tp-dialog__title">הרשמה ל{{pick.title}}</h2>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px;">
          <div style="display: flex; gap: 10px; align-items: center;"><span class="tp-icon-tile tp-icon-tile--sm"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>{{pick.when}}</span></div>
          <div style="display: flex; gap: 10px; align-items: center;"><span class="tp-icon-tile tp-icon-tile--sm"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>עם {{pick.coach}}</span></div>
          <div style="display: flex; gap: 10px; align-items: center;"><span class="tp-icon-tile tp-icon-tile--sm"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span><span>כלול במנוי החודשי שלך</span></div>
        </div>
        <p class="tp-caption" style="margin-top: 14px; font-size: 13px; line-height: 18px;">ביטול חינם עד 4 שעות לפני תחילת השיעור.</p>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 18px;">
          <button class="tp-btn tp-btn--lg tp-btn--block" type="button" onClick="{{confirm}}">אישור ההרשמה</button>
          <button class="tp-btn tp-btn--ghost tp-btn--block" type="button" onClick="{{closeSheet}}">לא עכשיו</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
    <div class="tp-toast tp-toast--success" role="status" style="position: absolute; bottom: 104px; inset-inline: 16px; z-index: 50;">
      <span class="tp-toast__tile"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span style="font-size: 14px;">{{toast}}</span>
      <button class="tp-toast__close" type="button" aria-label="סגירה" onClick="{{closeToast}}"><svg class="tp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 1, cat: 'all', booked: { t1: true }, waiting: {}, sheet: null, toast: '' }; }
  renderVals() {
    const s = this.state;
    const data = {
      0: [['t1', '17:30', '50 דק׳', 'פילאטיס מכשירים', 'pil', 'דנה', 8, 8], ['t2', '19:00', '60 דק׳', 'יוגה בהריון', 'yoga', 'נועה', 6, 10], ['t3', '20:15', '75 דק׳', 'יין יוגה ונשימה', 'yoga', 'עומר', 14, 14]],
      1: [['w1', '07:00', '50 דק׳', 'פילאטיס מכשירים', 'pil', 'דנה', 6, 8], ['w2', '09:30', '60 דק׳', 'ויניאסה יוגה', 'yoga', 'נועה', 8, 14], ['w3', '18:00', '45 דק׳', 'פילאטיס כוח', 'pil', 'עומר', 10, 10], ['w4', '19:30', '45 דק׳', 'פילאטיס מזרן', 'pil', 'יעל', 4, 12]],
      2: [['h1', '07:00', '60 דק׳', 'ויניאסה יוגה', 'yoga', 'נועה', 5, 14], ['h2', '09:30', '50 דק׳', 'פילאטיס מכשירים', 'pil', 'דנה', 3, 8], ['h3', '18:30', '50 דק׳', 'פילאטיס מכשירים', 'pil', 'דנה', 2, 8], ['h4', '20:00', '75 דק׳', 'יין יוגה ונשימה', 'yoga', 'עומר', 6, 14]],
      3: [['f1', '08:00', '50 דק׳', 'פילאטיס מכשירים', 'pil', 'דנה', 8, 8], ['f2', '09:30', '60 דק׳', 'ויניאסה יוגה', 'yoga', 'נועה', 11, 14]]
    };
    const dayNames = ['היום', 'מחר', 'חמישי', 'שישי'];
    const dayDates = ['היום', 'מחר, רביעי 14.10', 'חמישי 15.10', 'שישי 16.10'];
    const days = dayNames.map((label, i) => ({ label, on: String(s.day === i), pick: () => this.setState({ day: i }) }));
    const cats = [['all', 'הכל'], ['pil', 'פילאטיס'], ['yoga', 'יוגה']].map(([id, label]) => ({
      label, on: String(s.cat === id), pick: () => this.setState({ cat: id }),
      cls: s.cat === id ? 'tp-chip tp-chip--plain tp-chip--brand' : 'tp-chip tp-chip--plain'
    }));
    const rows = (data[s.day] || []).filter((r) => s.cat === 'all' || r[4] === s.cat).map(([id, time, len, title, cat, coach, n0, cap]) => {
      const isBooked = !!s.booked[id];
      const waitPos = s.waiting[id];
      const n = n0 + (isBooked && id !== 't1' ? 1 : 0);
      const free = cap - n;
      const full = free <= 0;
      return {
        time, len, title, coach,
        spots: isBooked ? 'את רשומה לשיעור' : full ? 'מלא · ' + (id === 'w3' ? 2 : 3) + ' ממתינים' : free === 1 ? 'נשאר מקום אחד' : 'נשארו ' + free + ' מקומות',
        isBooked, isWaiting: !!waitPos, waitLabel: 'במקום ' + waitPos + ' בהמתנה',
        canBook: !isBooked && !waitPos && !full, canWait: !isBooked && !waitPos && full,
        book: () => this.setState({ sheet: { id, title, coach, when: dayDates[s.day] + ' · ' + time + ' · ' + len } }),
        wait: () => this.setState({ waiting: { ...s.waiting, [id]: id === 'w3' ? 3 : 4 }, toast: 'נכנסת לרשימת ההמתנה. נודיע לך כשיתפנה מקום.' })
      };
    });
    const pick = s.sheet || { title: '', coach: '', when: '' };
    return {
      days, cats, rows, pick, sheet: !!s.sheet,
      confirm: () => this.setState({ booked: { ...s.booked, [s.sheet.id]: true }, sheet: null, toast: 'נרשמת לשיעור. תזכורת תגיע שעתיים לפני.' }),
      closeSheet: () => this.setState({ sheet: null }),
      hasToast: !!s.toast, toast: s.toast, closeToast: () => this.setState({ toast: '' })
    };
  }
}
</script>
</body>
</html>
