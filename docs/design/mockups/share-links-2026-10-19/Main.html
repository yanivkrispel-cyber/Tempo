<!doctype html>

<body>
<div class="tp" dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f5f4f2; font-size: 15px; line-height: 22px;">

  <header style="position: absolute; top: 52px; inset-inline: 20px; display: flex; align-items: center; justify-content: space-between;">

      <p class="muted" style="font-size: 16px;">שלישי 21.10, בין 18:30 ל-19:20</p>
    </div>

    <ul style="display: flex; flex-direction: column; gap: 10px;">
      <li class="row">
        <div class="photo" aria-hidden="true" style="width: 40px; height: 40px; border-radius: 999px; object-fit: cover;"></div>

      </li>
      <li class="meta"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>חדר האור, אבן גבירול 112, תל אביב</li>

        <div class="seats" aria-label="7 מתוך 10 תפוסים"><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat"></span><span class="seat seat--free"></span><span class="seat seat--free"></span><span class="seat seat--free"></span></div>
        <span>7 מתוך 10</span>

      <span class="avatar" style="background: var(--brand-soft); color: var(--brand-deep);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12v8H4v-8M2 7h20v5H2zM12 20V7M12 7H8a2 2 0 1 1 2-3l2 3 2-3a2 2 0 1 1 2 3h-4"></path></svg></span>
      <div style="display: flex; flex-direction: column;"><span style="font-weight: 600;">שיעור ראשון ב-40 ₪</span><span class="muted" style="font-size: 13px;">משלמים בסטודיו, בלי כרטיס אשראי עכשיו</span></div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
      <a class="btn btn-brand" href="Booked.html">שריינו לי מקום</a>
      <p class="built">נבנה עם <bdi>Tempo</bdi></p>
