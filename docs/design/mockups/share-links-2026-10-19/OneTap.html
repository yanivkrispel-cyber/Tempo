<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הרשמה באותו מסך</title>
<link rel="stylesheet" href="share.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:#24505f}a:hover{color:#2b2420}
</style>
</head>
<body>
<div class="tp" dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f5f4f2; font-size: 15px; line-height: 22px; display: flex; flex-direction: column;">
  <div style="position: relative; height: 230px; flex: none;">
    <div class="photo" role="img" aria-label="חדר הרפורמרים של סטודיו נשימה" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%;">תמונה</div>
    <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,26,29,0.5) 0%, rgba(20,26,29,0.05) 50%, rgba(20,26,29,0.55) 100%);"></div>
    <div class="row" style="position: absolute; top: 52px; inset-inline: 20px; color: #fff;">
      <span class="mark"><svg class="icon" viewBox="0 0 48 48" style="width: 22px; height: 22px; stroke-width: 3.4;" aria-hidden="true"><path d="M8 28c5-7 9-7 13 0s8 7 13 0 7-6 6-4"></path><path d="M10 19c4-4 7-4 11 0"></path></svg></span>
      <span style="font-size: 15px; font-weight: 600;">סטודיו נשימה</span>
    </div>
    <div style="position: absolute; bottom: 18px; inset-inline: 22px; color: #fff; display: flex; flex-direction: column; gap: 2px;">
      <h1 class="serif" style="font-size: 30px; line-height: 36px; font-weight: 400;">רפורמר זרימה</h1>
      <p style="font-size: 14px; opacity: 0.92;">שלישי 21.10, 18:30 · מאיה לוי · נשארו 3 מקומות</p>
    </div>
  </div>

  <section style="flex: 1; padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="font-size: 20px; line-height: 26px; font-weight: 600;">שריון מקום בשיעור ראשון</h2>
      <p class="muted" style="font-size: 14px;">40 ₪ בסטודיו. שני פרטים, קוד למייל, וזהו.</p>
    </div>
    <div class="field">
      <label for="name1">שם מלא</label>
      <input id="name1" class="input" type="text" value="נגה כהן">
    </div>
    <div class="field">
      <label for="email1">מייל</label>
      <input id="email1" class="input input--focus" type="email" value="noga@example.com" dir="ltr" style="text-align: right;">
    </div>
    <label class="row" for="terms1" style="font-size: 13px; color: var(--ink-2); gap: 10px; align-items: flex-start;">
      <input id="terms1" type="checkbox" checked style="width: 20px; height: 20px; accent-color: #2f6577; margin: 1px 0 0;">
      <span>מאשרת את <a href="#">תנאי הסטודיו</a>. הצהרת בריאות קצרה תופיע אחרי הקוד.</span>
    </label>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
      <a class="btn btn-brand" href="Booked.html">שלחו קוד ושריינו</a>
      <a class="btn btn-ghost" href="#" style="align-self: center;">כבר מתאמנת כאן? כניסה</a>
    </div>
  </section>
</div>
</body>
</html>
