<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>לאן הקישור יוביל</title>
<link rel="stylesheet" href="share.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:#24505f}a:hover{color:#2b2420}
</style>
</head>
<body>
<div class="tp" dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2b2420; font-size: 15px; line-height: 22px;">
  <div aria-hidden="true" style="position: absolute; top: 60px; inset-inline: 95px; height: 360px; border-radius: 18px; overflow: hidden; background: #1d2427;">
    <div class="photo" aria-hidden="true" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.85;"></div>
    <div style="position: absolute; inset: auto 12px 14px 12px; color: #fff; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: var(--serif); font-size: 22px; line-height: 26px;">מקומות אחרונים</span>
      <span style="font-size: 12px;">רפורמר זרימה · שלישי 18:30</span>
    </div>
  </div>

  <section style="position: absolute; bottom: 0; inset-inline: 0; padding: 22px 20px 26px; border-radius: 28px 28px 0 0; background: #f5f4f2; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h1 style="font-size: 20px; line-height: 26px; font-weight: 600;">לאן הקישור יוביל?</h1>
      <p class="muted" style="font-size: 14px;">הקישור נכנס לסטיקר של הסטורי. בחרנו לפי התבנית, ואפשר לשנות.</p>
    </div>
    <div class="card" style="display: flex; flex-direction: column;">
      <label class="slot" for="t1" style="gap: 12px; background: var(--brand-soft); border-radius: 22px 22px 0 0;">
        <input id="t1" type="radio" name="target" checked style="width: 20px; height: 20px; accent-color: #2f6577; margin: 0;">
        <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">לשיעור הזה</span><span class="muted" style="font-size: 13px;">רפורמר זרימה, שלישי 18:30. אם יתמלא, יוצעו שיעורים קרובים</span></div>
      </label>
      <div class="divider"></div>
      <label class="slot" for="t2" style="gap: 12px;">
        <input id="t2" type="radio" name="target" style="width: 20px; height: 20px; accent-color: #2f6577; margin: 0;">
        <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">למערכת של השבוע</span><span class="muted" style="font-size: 13px;">כל השיעורים, עם מקומות פנויים</span></div>
      </label>
      <div class="divider"></div>
      <label class="slot" for="t3" style="gap: 12px;">
        <input id="t3" type="radio" name="target" style="width: 20px; height: 20px; accent-color: #2f6577; margin: 0;">
        <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">למבצע</span><span class="muted" style="font-size: 13px;">3 שיעורי ניסיון ב-99 ₪</span></div>
      </label>
      <div class="divider"></div>
      <label class="slot" for="t4" style="gap: 12px;">
        <input id="t4" type="radio" name="target" style="width: 20px; height: 20px; accent-color: #2f6577; margin: 0;">
        <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">למחירון</span><span class="muted" style="font-size: 13px;">כל הכרטיסיות והמנויים</span></div>
      </label>
    </div>
    <div class="row" style="gap: 10px;">
      <button class="btn btn-paper" type="button" style="flex: 1;">הורדה</button>
      <button class="btn btn-brand" type="button" style="flex: 2;">שיתוף והעתקת הקישור</button>
    </div>
  </section>
</div>
</body>
</html>
