<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>קישור למבצע</title>
<link rel="stylesheet" href="share.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:#24505f}a:hover{color:#2b2420}
</style>
</head>
<body>
<div class="tp" dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f5f4f2; font-size: 15px; line-height: 22px;">
  <div class="photo" role="img" aria-label="חדר הרפורמרים של סטודיו נשימה" style="position: absolute; inset: 0 0 auto 0; width: 100%; height: 300px; object-fit: cover; object-position: 50% 36%;">תמונה</div>
  <div aria-hidden="true" style="position: absolute; inset: 0 0 auto 0; height: 300px; background: linear-gradient(180deg, rgba(20,26,29,0.45) 0%, rgba(20,26,29,0) 45%, rgba(20,26,29,0.3) 100%);"></div>
  <header class="row" style="position: absolute; top: 52px; inset-inline: 20px; color: #fff;">
    <span class="mark"><svg class="icon" viewBox="0 0 48 48" style="width: 22px; height: 22px; stroke-width: 3.4;" aria-hidden="true"><path d="M8 28c5-7 9-7 13 0s8 7 13 0 7-6 6-4"></path><path d="M10 19c4-4 7-4 11 0"></path></svg></span>
    <span style="font-size: 15px; font-weight: 600;">סטודיו נשימה</span>
  </header>

  <section class="glass" style="position: absolute; top: 230px; bottom: 0; inset-inline: 0; padding: 24px 20px 22px; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span class="chip chip-warn" style="align-self: flex-start;">למצטרפות חדשות, עד 31.10</span>
      <h1 class="serif" style="font-size: 32px; line-height: 38px; font-weight: 400;">3 שיעורי ניסיון ב-99 ₪</h1>
      <p class="muted">שלושה שיעורים לבחירה מכל המערכת, תוך 5 שבועות מהשיעור הראשון.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="font-size: 15px; font-weight: 600;">בחרי את השיעור הראשון</h2>
      <div class="card" style="display: flex; flex-direction: column;">
        <label class="slot" for="o1" style="background: var(--brand-soft); border-radius: 22px 22px 0 0;"><input id="o1" type="radio" name="first" checked style="width: 20px; height: 20px; accent-color: #2f6577; margin: 0;"><time>18:30</time><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">רפורמר זרימה</span><span class="muted" style="font-size: 13px;">שלישי 21.10 · מאיה לוי</span></div><span class="chip chip-warn">נשארו 3</span></label>
        <div class="divider"></div>
        <label class="slot" for="o2"><input id="o2" type="radio" name="first" style="width: 20px; height: 20px; accent-color: #2f6577; margin: 0;"><time>09:15</time><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">רפורמר בסיסי</span><span class="muted" style="font-size: 13px;">רביעי 22.10 · מאיה לוי</span></div></label>
        <div class="divider"></div>
        <label class="slot" for="o3"><input id="o3" type="radio" name="first" style="width: 20px; height: 20px; accent-color: #2f6577; margin: 0;"><time>20:00</time><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">מתיחות ונשימה</span><span class="muted" style="font-size: 13px;">חמישי 23.10 · יעל בר</span></div></label>
      </div>
      <a href="StudioFirst.html" style="font-size: 14px; font-weight: 600;">כל המערכת</a>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <a class="btn btn-brand" href="Booked.html">לקחת את המבצע ולשריין</a>
      <p class="muted" style="font-size: 13px; text-align: center;">משלמים 99 ₪ בסטודיו, בשיעור הראשון</p>
    </div>
  </section>
</div>
</body>
</html>
