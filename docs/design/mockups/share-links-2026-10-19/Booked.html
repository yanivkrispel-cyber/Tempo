<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>אחרי השריון</title>
<link rel="stylesheet" href="share.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f5f4f2}
a{color:#24505f}a:hover{color:#2b2420}
</style>
</head>
<body>
<div class="tp" dir="rtl" lang="he" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f5f4f2; font-size: 15px; line-height: 22px;">
  <div class="photo" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(16px) saturate(1.1); transform: scale(1.12); opacity: 0.5;"></div>

  <section class="glass" style="position: absolute; top: 70px; inset-inline: 16px; padding: 26px 22px 22px; border-radius: 30px; display: flex; flex-direction: column; gap: 16px;">
    <span class="avatar" style="width: 56px; height: 56px; background: var(--brand); color: #fff;"><svg class="icon" viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke-width: 2.2;" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 class="serif" style="font-size: 30px; line-height: 36px; font-weight: 400;">שמרנו לך מקום, נגה</h1>
      <p class="muted">רפורמר זרימה, שלישי 21.10 בשעה 18:30, חדר האור. 40 ₪ משלמים בסטודיו.</p>
    </div>
    <ul style="display: flex; flex-direction: column; gap: 10px;">
      <li class="row" style="gap: 12px;"><span class="avatar" style="width: 32px; height: 32px; background: var(--brand-soft); color: var(--brand-deep);"><svg class="icon" viewBox="0 0 24 24" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span>הצהרת בריאות נחתמה</span></li>
      <li class="row" style="gap: 12px;"><span class="avatar" style="width: 32px; height: 32px; background: var(--cream); color: var(--ink-2);"><svg class="icon" viewBox="0 0 24 24" style="width: 16px; height: 16px;" aria-hidden="true"><path d="M12 7v5l3 2"></path><circle cx="12" cy="12" r="8"></circle></svg></span><span>מגיעים 10 דקות לפני, עם גרביים</span></li>
    </ul>
    <div class="row" style="gap: 10px;">
      <button class="btn btn-paper btn-sm" type="button" style="flex: 1;">הוספה ליומן</button>
      <button class="btn btn-paper btn-sm" type="button" style="flex: 1;">שליחה לחברה</button>
    </div>
  </section>

  <section class="card" style="position: absolute; bottom: 34px; inset-inline: 16px; padding: 18px 18px; display: flex; flex-direction: column; gap: 12px;">
    <div class="row" style="gap: 12px;">
      <span class="mark" style="width: 48px; height: 48px; border-radius: 14px;"><svg class="icon" viewBox="0 0 48 48" style="width: 28px; height: 28px; stroke-width: 3.2;" aria-hidden="true"><path d="M8 28c5-7 9-7 13 0s8 7 13 0 7-6 6-4"></path><path d="M10 19c4-4 7-4 11 0"></path></svg></span>
      <div style="display: flex; flex-direction: column;"><span style="font-weight: 600;">נשימה במסך הבית</span><span class="muted" style="font-size: 13px;">ביטול, מעבר שיעור ותזכורת, בלחיצה</span></div>
    </div>
    <button class="btn btn-brand" type="button">הוספה למסך הבית</button>
    <a class="btn btn-ghost" href="#" style="align-self: center;">אחר כך</a>
  </section>
</div>
</body>
</html>
