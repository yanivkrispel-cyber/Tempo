        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/me/notification-preferences:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Notifications]
      operationId: getMyNotificationPreferences
      summary: "The caller's notification channels, reminder switches and quiet hours in this studio (self)"
      description: >-
        Defaults apply when the member never saved (docs/30 sections 5 and 7): inbox and push on for every group,
        every reminder the studio offers on, quiet hours null (the studio's window applies).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Notifications]
      operationId: updateMyNotificationPreferences
      summary: "Save the caller's notification preferences in this studio (self)"
      description: >-
        The inbox cannot be switched off, and the `bookings` group (service notices about the member's own
        bookings) keeps at least the inbox: `inbox: false` answers 400 `preferences.inbox_required`. Quiet hours are
        two local times in the studio's time zone; equal times answer 400 `quietHours.invalid`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferencesInput" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/me/push-subscriptions:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Notifications]
      operationId: listMyPushSubscriptions
      summary: "The caller's devices that receive push from this studio (self)"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscriptionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Notifications]
      operationId: createMyPushSubscription
      summary: "Register this browser's push subscription for this studio (self)"
      description: >-
        The body is the browser's `PushSubscription.toJSON()` plus a device label. Registering an endpoint that is
        already registered for the caller in this studio returns the existing subscription with 200 (idempotent).
        The endpoint must be a browser push service over `https://` (FCM, Mozilla autopush, WNS, Apple); anything
        else answers 400 `push.endpoint_invalid`. Keys that do not decode to a P-256 point and a 16-byte secret
        answer 400 `push.keys_invalid`. A member keeps at most 10 devices per studio; registering an eleventh drops
        the oldest. A subscription the push service later reports gone (404 or 410) is deleted by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePushSubscriptionRequest" }
      responses:
        "200":
          description: Already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/me/push-subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/SubscriptionId"
    delete:
      tags: [Notifications]
      operationId: deleteMyPushSubscription
      summary: "Stop push to one of the caller's devices (self)"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/push/vapid-public-key:
    get:
      tags: [Notifications]
      operationId: getVapidPublicKey
      summary: "The environment's VAPID public key, for PushManager.subscribe (any signed-in account)"
      description: >-
        The same key for every studio in the environment (docs/30 section 4.3). It changes only when the key pair
        is rotated, after which every browser subscribes again. Before the key pair is set up in an environment
        the route answers 404 `push.unavailable`; the app then hides the push switch.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VapidPublicKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/notification-settings:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Notifications]
      operationId: getNotificationSettings
      summary: "The studio's quiet hours and reminder timing (`organization.view`)"
      description: Defaults until the studio saves (docs/30 D-4, D-5).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Notifications]
      operationId: updateNotificationSettings
      summary: "Change the studio's quiet hours and reminder timing (`organization.settings.manage`)"
      description: >-
        A reminder switched off here is off for every member; one switched on is on for members who did not switch
        it off. Out-of-range values answer 400 with the field in `errors`. Equal quiet-hour times answer 400
        `quietHours.invalid`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Restricted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/notification-templates:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Notifications]
      operationId: listNotificationTemplates
      summary: "Every kind a studio can word, by group, and whether it has its own words (`organization.settings.manage`)"
      description: >-
        One row per templated kind of docs/30 section 5. `session.message` and `studio.announcement` carry the
        staff's own text and have no template.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/notification-templates/{kind}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: kind
        in: path
        required: true
        description: A templated kind, e.g. `booking.promoted`; any other answers 404 `template.kind_unknown`.
        schema: { type: string, pattern: "^[a-z][a-z_]*(\\.[a-z][a-z_]*)+$" }
    get:
      tags: [Notifications]
      operationId: getNotificationTemplate
      summary: "The words in use for one kind, with its variables and a preview on the demo studio's data (`organization.settings.manage`)"
      parameters:
        - name: locale
          in: query
          schema: { type: string, enum: [he, en], default: he }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Notifications]
      operationId: updateNotificationTemplate
      summary: "Save the studio's words for one kind, or go back to the default (`organization.settings.manage`)"
      description: >-
        Each channel saved becomes the studio's new active version (the previous one is kept as `retired`); `null`
        retires the studio's version so the platform default applies again. Audited as `template.changed` with the
        kind, locale, channel and version, never the text. 400 `template.unknown_variable` names the field
        (`inbox.subject`, `push.body`, ...) and the `variable`; 400 `template.invalid` for an empty or too long
        text. 409 `concurrency.conflict` when `If-Match` is stale. The next notification of the kind uses the new
        words.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplateInput" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Restricted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/announcements:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Notifications]
      operationId: getAnnouncementAllowance
      summary: "Who an announcement would reach now and how many are left today (`bookings.manage`)"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementAllowance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Notifications]
      operationId: sendAnnouncement
      summary: "Send a studio announcement to every active member (`bookings.manage`)"
      description: >-
        One `studio.announcement` inbox item per active member, through the members' preferences and quiet hours
        (docs/30 section 7). At most 3 a day per studio (429 `announcement.daily_limit` with `dailyLimit` and
        `Retry-After` until the studio's next midnight) and at most 500 recipients (409
        `announcement.too_many_recipients` with `recipients` and `maxRecipients`; nothing is sent). The text is
        Markdown-light without variables; the inbox shows it as written, and push carries only the kind and ids.
        Audited as `announcement.sent` with the recipient count, never the text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Restricted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/organizations/{organizationId}/people/{personId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [Notifications]
      operationId: listPersonDeliveries
      summary: "A person's last 30 delivery lines, newest first (`people.view`)"
      description: Kind, channel, status, reason and times only; never the text or the address (docs/30 D-6).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/me/health-declaration:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Health declaration]
      operationId: getMyHealthDeclaration
      summary: "My declaration's status, the current form, and whether the studio requires it (self)"
      description: No answers and no names (docs/31 section 9); the member's copy of those is in the export.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyHealthDeclaration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Health declaration]
      operationId: signMyHealthDeclaration
      summary: "Sign the current form, for myself or as a guardian (self); replaces my current declaration"
      description: |
        `signedName` is the member's full name (whose declaration it is); `guardianName` is the guardian who signs,
        only for `signerRole: guardian`. 400 `health.answers_incomplete`, `health.confirmation_required`,
        `health.signed_name_invalid`, `health.guardian_name_required`; 409 `health.form_version_stale` (reload the
        form); 503 `health.key_unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignHealthDeclarationRequest" }
      responses:
        "201":
          description: Signed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyHealthDeclaration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Restricted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/organizations/{organizationId}/people/{personId}/health-declaration:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [Health declaration]
      operationId: getPersonHealthDeclaration
      summary: "A person's declaration status and dates, no answers (`people.view`)"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDeclarationStatusView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people/{personId}/health-declaration/answers:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [Health declaration]
      operationId: getPersonHealthDeclarationAnswers
      summary: "A person's current answers and signer names (`health.view`; every read is audited)"
      description: |
        Writes `health.declaration.viewed` (no content). Sent with `Cache-Control: no-store`; apps must not cache
        it. 404 `health.declaration_not_found` when the status is `missing`; 503 `health.key_unavailable`.
      responses:
        "200":
          description: OK.
          headers:
            Cache-Control:
              schema: { type: string, examples: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDeclarationAnswers" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/organizations/{organizationId}/people/{personId}/health-declaration/medical-approval:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    post:
      tags: [Health declaration]
      operationId: recordMedicalApproval
      summary: "Record that a doctor's approval was received (`health.view`); `needs_medical_approval` becomes `signed`"
      description: 409 `health.no_approval_needed` when the status is not `needs_medical_approval`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicalApprovalRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthDeclarationStatusView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Restricted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/me/progress:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Progress]
      operationId: getMyProgress
      summary: "My visits this month, my monthly goal and my streak of weeks in this studio (self)"
      description: Only attended classes count, by the session's start in the studio's time zone (docs/31 section 12).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyProgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/me/progress/goal:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    put:
      tags: [Progress]
      operationId: setMyMonthlyGoal
      summary: "Set my monthly goal (1 to 31), or clear it with null (self)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonthlyGoalRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyProgress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/reports/summary:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Reports]
      operationId: getReportSummary
      summary: "Weekly figures, per class type and members for a period (`reports.view`)"
      description: |
        docs/32 sections 4 and 5. `from` and `to` are dates in the studio's time zone, both included, at most 92
        days. Without both, the last 4 full Sunday-to-Saturday weeks before today. Only sessions that have started
        count. No names and no health data.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: First day, in the studio's time zone. Send with `to`, or neither.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Last day, included.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSummary" }
        "400":
          description: "`report.period_invalid` (one date without the other, or `to` before `from`), `report.period_too_long` (over 92 days)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/reports/passes-ending:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Reports]
      operationId: listPassesEnding
      summary: "Passes that end within 14 days or have one entry left (`reports.view` and `people.view`)"
      description: docs/32 section 6. At most 50 rows, the soonest first; `truncated` says more exist.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassesEndingReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/reports/members-at-risk:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Reports]
      operationId: listMembersAtRisk
      summary: "Members with a valid pass and no attended class for 30 days (`reports.view` and `people.view`)"
      description: docs/32 section 6. At most 50 rows, the longest absence first; `truncated` says more exist.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembersAtRiskReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/billing:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      operationId: getBilling
      summary: "The studio's plan, subscription state and billing details (`billing.view`)"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/billing/account:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      tags: [Billing]
      operationId: updateBillingAccount
      summary: "Billing email, legal name, business id (`billing.manage`)"
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBillingAccountRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/plans:
    get:
      tags: [Billing]
      operationId: listPlans
      summary: "Public plans and their entitlements (any signed-in account)"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/platform/organizations/{organizationId}/billing/plan:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    put:
      tags: [Platform]
      operationId: platformSetPlan
      x-tempo-planned: true
      summary: "Move a studio to a plan version (audited)"
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPlanRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/platform/organizations/{organizationId}/billing/payments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Platform]
      operationId: platformRecordPayment
      x-tempo-planned: true
      summary: "Record a manual payment (audited)"
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordPaymentRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/platform/organizations/{organizationId}/billing/overrides/{entitlementKey}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EntitlementKey"
    put:
      tags: [Platform]
      operationId: platformSetEntitlementOverride
      x-tempo-planned: true
      summary: "Override one entitlement for one studio (audited)"
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetEntitlementOverrideRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    customerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the customer pool `tempo-{env}-users`.
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the operator pool `tempo-{env}-operators` (MFA required).

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Before:
      name: before
      in: query
      required: false
      description: The `id` of the last item on the previous page.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NoteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `version` you last read. A stale value returns 409 `concurrency.conflict`.
      schema: { type: string }

    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }

    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassTypeId:
      name: classTypeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PassId:
      name: passId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntitlementKey:
      name: entitlementKey
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$", examples: [rooms.max] }

  responses:
    Problem:
      description: Unexpected error.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: |
        Validation failed; `errors` lists the fields. Phase 2 codes include `contact.required`,
        `contact_point.invalid_phone`, `contact_point.invalid_email`, `consent.invalid`, `role_ids.required`,
        `role_ids.single`, `role.not_found`, `relationship.invalid_type`, `relationship.self`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, invalid or wrong-pool token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StepUpOrUnauthorized:
      description: |
        Missing, invalid or wrong-pool token, or `auth.step_up_required`: the action needs a sign-in within the
        last 10 minutes.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        Signed in but not allowed, for example `permission.denied` (the caller lacks the route's permission),
        `account.disabled`, `account.email_not_verified`, `membership.suspended`, `organization.suspended`,
        `invitation.email_mismatch`, `operator.not_registered`, `auth.mfa_required`, `role.exceeds_actor`,
        `membership.forbidden_role_change`, `ownership.target_not_admin`, `status.not_allowed`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |
        Not found, or not visible to the caller. A studio the caller does not belong to is also 404
        (`organization.not_found`), so ids cannot be probed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        `organization.slug_taken`, `organization.creation_limit`, `concurrency.conflict`,
        `ownership.transfer_pending`, `ownership.transfer_stale` (roles changed since the offer; it is cancelled),
        `person.has_login`, `person.merge_both_have_login`, `person.read_only` (anonymized or merged),
        `contact_point.verified` (the sign-in email changes only with the account), `relationship.exists`,
        `health.declaration_required`, `health.form_version_stale`, `health.no_approval_needed`,
        `template.has_bookings` (a weekly class with bookings cannot end before its first day).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many requests. Invitation and join calls allow 20 per account per hour; other routes are limited at the edge.
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    ServiceUnavailable:
      description: |
        A dependency the operation needs is not available and the API fails closed, e.g.
        `health.key_unavailable` (the health data key cannot be read; docs/31 section 7).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Restricted:
      description: The studio's subscription is restricted (`billing.restricted`); reads and cancellations still work.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code, e.g. `membership.not_found`.
          examples: [organization.not_found]
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        frozenUntil:
          type: string
          format: date
          description: On `booking.no_valid_pass` only, when the person's membership is frozen on that day (docs/29 section 16.4).
        organizationIds:
          type: array
          items: { type: string, format: uuid }
          description: On `account.sole_owner` only, the studios where the caller is the only owner (docs/32 section 9).
        deletableFrom:
          type: string
          format: date-time
          description: On `organization.suspended_too_recently` only, when the studio can be removed (docs/32 section 10).

    Health:
      type: object
      required: [status, environment, version, timestamp, correlationId]
      properties:
        status: { type: string, examples: [healthy] }
        environment: { type: string }
        version: { type: string }
        timestamp: { type: string, format: date-time }
        correlationId: { type: string }

    Role:
      type: string
      enum: [owner, admin, staff, client]
    MembershipStatus:
      type: string
      enum: [invited, active, suspended, removed]
    OrganizationStatus:
      type: string
      enum: [active, suspended]
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    InvitableRole:
      type: string
      enum: [admin, staff, client]

    Me:
      type: object
      required: [id, email, emailVerified, locale, status, memberships]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        displayName: { type: [string, "null"] }
        locale: { type: string, examples: [he-IL] }
        status:
          type: string
          enum: [active, disabled]
        memberships:
          type: array
          items: { $ref: "#/components/schemas/MyMembership" }

    MyMembership:
      type: object
      description: One studio the caller belongs to, for the studio switcher.
      required: [membershipId, role, roles, permissions, status, organization]
      properties:
        membershipId: { type: string, format: uuid }
        role:
          $ref: "#/components/schemas/Role"
          deprecated: true
          description: Phase 1 field, kept one release. Read `roles` and `permissions` instead.
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleSummary" }
        permissions:
          type: array
          description: The union of the permissions of the caller's live roles in this studio.
          items: { $ref: "#/components/schemas/PermissionKey" }
        pendingOwnershipTransfer:
          oneOf:
            - $ref: "#/components/schemas/PendingOwnershipTransfer"
            - type: "null"
        status: { $ref: "#/components/schemas/MembershipStatus" }
        subscriptionState:
          description: The studio's subscription state (docs/28), for banners and restricted mode.
          oneOf:
            - $ref: "#/components/schemas/SubscriptionState"
            - type: "null"
        entitlements:
          description: The studio's entitlements (docs/28), to hide or upsell features.
          oneOf:
            - $ref: "#/components/schemas/Entitlements"
            - type: "null"
        organization:
          type: object
          required: [id, slug, displayName, status]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            displayName: { type: string }
            status: { $ref: "#/components/schemas/OrganizationStatus" }

    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        locale:
          type: string
          enum: [he-IL, en-US]

    Slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
      description: Lowercase Latin letters, digits and hyphens, 3 to 40 characters.
      examples: [studio-neshima]

    Organization:
      type: object
      required: [id, slug, displayName, status, countryCode, defaultLocale, timeZone, currencyCode, joinLinkEnabled, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        displayName: { type: string, examples: [סטודיו נשימה] }
        status: { $ref: "#/components/schemas/OrganizationStatus" }
        countryCode: { type: string, examples: [IL] }
        defaultLocale: { type: string, examples: [he-IL] }
        timeZone: { type: string, examples: [Asia/Jerusalem] }
        currencyCode: { type: string, examples: [ILS] }
        joinLinkEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        version: { type: string, description: Send back in `If-Match` when updating. }

    CreateOrganizationRequest:
      type: object
      required: [displayName, slug]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        slug: { $ref: "#/components/schemas/Slug" }
        timeZone: { type: string, default: Asia/Jerusalem }
        defaultLocale: { type: string, default: he-IL }

    UpdateOrganizationRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        timeZone: { type: string }
        defaultLocale: { type: string }

    Member:
      type: object
      required: [id, userAccountId, email, role, roles, status, joinedAt, version]
      properties:
        id: { type: string, format: uuid, description: The membership id. }
        userAccountId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: [string, "null"] }
        role:
          $ref: "#/components/schemas/Role"
          deprecated: true
          description: Phase 1 field, kept one release. Read `roles` instead.
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleSummary" }
        personId: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/MembershipStatus" }
        joinedAt: { type: string, format: date-time }
        version: { type: string }

    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        nextBefore: { type: [string, "null"], format: uuid }

    UpdateMemberRequest:
      type: object
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/InvitableRole" }
        status:
          type: string
          enum: [active, suspended]

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/InvitableRole" }

    Invitation:
      type: object
      required: [id, email, role, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/InvitableRole" }
        status: { $ref: "#/components/schemas/InvitationStatus" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        invitedBy:
          type: object
          required: [membershipId]
          properties:
            membershipId: { type: string, format: uuid }
            displayName: { type: [string, "null"] }

    CreatedInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [link]
          properties:
            link:
              type: string
              format: uri
              description: |
                Shown once, as `https://<app>/invite#<token>`. The token is in the fragment, which browsers never
                send to a server; the app reads it and sends it in the body of preview and accept.

    InvitationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        nextBefore: { type: [string, "null"], format: uuid }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 100 }

    InvitationPreview:
      type: object
      required: [organization, role, expiresAt]
      properties:
        organization:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        role: { $ref: "#/components/schemas/InvitableRole" }
        invitedByDisplayName: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }

    JoinCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 16, maxLength: 64 }

    JoinPreview:
      type: object
      required: [organization]
      properties:
        organization:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }

    JoinLink:
      type: object
      required: [link, createdAt]
      properties:
        link:
          type: string
          format: uri
          description: |
            `https://<client app>/join#<code>`. The code is in the fragment; the app sends it in the body of
            join preview and join.
        createdAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, occurredAt, actorType, action, targetType]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorType:
          type: string
          enum: [user, operator, system]
        actorDisplayName: { type: [string, "null"] }
        action: { type: string, examples: [membership.role_changed] }
        targetType: { type: string, examples: [membership] }
        targetId: { type: [string, "null"], format: uuid }
        data:
          type: object
          additionalProperties: true

    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        nextBefore: { type: [string, "null"], format: uuid }

    PlatformOrganization:
      type: object
      required: [id, slug, displayName, status, createdAt, owner, memberCounts]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        displayName: { type: string }
        status: { $ref: "#/components/schemas/OrganizationStatus" }
        createdAt: { type: string, format: date-time }
        owner:
          type: object
          required: [userAccountId, email]
          properties:
            userAccountId: { type: string, format: uuid }
            email: { type: string, format: email }
            displayName: { type: [string, "null"] }
        memberCounts:
          type: object
          required: [owner, admin, staff, client]
          properties:
            owner: { type: integer }
            admin: { type: integer }
            staff: { type: integer }
            client: { type: integer }

    PlatformOrganizationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformOrganization" }
        nextBefore: { type: [string, "null"], format: uuid }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }

    PlatformStats:
      type: object
      required: [activeOrganizations, suspendedOrganizations, accounts, activeMemberships, hourlyBackupThreshold]
      properties:
        activeOrganizations: { type: integer }
        suspendedOrganizations: { type: integer }
        accounts: { type: integer }
        activeMemberships: { type: integer }
        hourlyBackupThreshold:
          type: integer
          description: Active studios at which the owner is alerted to move to hourly backups (ADR-0021).
          examples: [10]

    PermissionKey:
      type: string
      description: |
        A stable key from the permission catalog (docs/27 section 3.1). New keys can appear in later phases, so
        clients must ignore keys they do not know.
      examples: [members.view, people.manage]

    RoleSummary:
      type: object
      required: [id, key, displayName, isSystem]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, examples: [admin] }
        displayName: { type: string, examples: [מנהל] }
        isSystem: { type: boolean }

    RoleDetail:
      allOf:
        - $ref: "#/components/schemas/RoleSummary"
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items: { $ref: "#/components/schemas/PermissionKey" }

    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoleDetail" }

    Permission:
      type: object
      required: [key, description]
      properties:
        key: { $ref: "#/components/schemas/PermissionKey" }
        description: { type: string }

    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    SetMemberRolesRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }

    OwnershipTransferStatus:
      type: string
      enum: [pending, accepted, declined, cancelled, expired]

    OwnershipTransfer:
      type: object
      required: [id, status, from, to, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OwnershipTransferStatus" }
        from: { $ref: "#/components/schemas/MemberRef" }
        to: { $ref: "#/components/schemas/MemberRef" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PendingOwnershipTransfer:
      type: object
      description: Shown on the membership of the owner who offered the studio and of the admin who can accept it.
      required: [id, direction, expiresAt]
      properties:
        id: { type: string, format: uuid }
        direction:
          type: string
          enum: [outgoing, incoming]
        expiresAt: { type: string, format: date-time }

    MemberRef:
      type: object
      required: [membershipId]
      properties:
        membershipId: { type: string, format: uuid }
        displayName: { type: [string, "null"] }

    StartOwnershipTransferRequest:
      type: object
      required: [toMembershipId]
      properties:
        toMembershipId: { type: string, format: uuid }

    ForceOwnerTransferRequest:
      type: object
      required: [toMembershipId, reason, ticket]
      properties:
        toMembershipId: { type: string, format: uuid }
        reason: { type: string, minLength: 5, maxLength: 500 }
        ticket: { type: string, minLength: 1, maxLength: 100, description: Support ticket reference. }

    PersonStatus:
      type: string
      enum: [active, archived, anonymized, merged]

    PersonSource:
      type: string
      description: "`organization_created` is the owner who opened the studio."
      enum: [organization_created, join_link, invitation, staff_created, import]

    Person:
      type: object
      required: [id, displayName, status, source, hasLogin, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, examples: [נועה לוי] }
        givenName: { type: [string, "null"] }
        familyName: { type: [string, "null"] }
        birthDate: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/PersonStatus" }
        source: { $ref: "#/components/schemas/PersonSource" }
        hasLogin: { type: boolean }
        membershipId: { type: [string, "null"], format: uuid }
        primaryEmail: { type: [string, "null"], format: email }
        primaryPhone: { type: [string, "null"], description: E.164, examples: ["+972501234567"] }
        mergedIntoId: { type: [string, "null"], format: uuid }
        tags:
          type: array
          description: The person's tags, by name (docs/34 section 7). Sent once N1 is live; absent before.
          items: { $ref: "#/components/schemas/PersonTag" }
        createdAt: { type: string, format: date-time }
        version: { type: string, description: Send back in `If-Match` when updating. }

    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [contactPoints, consents, relationships]
          properties:
            contactPoints:
              type: array
              items: { $ref: "#/components/schemas/ContactPoint" }
            consents:
              type: array
              description: The current state per purpose and channel (the latest row of each).
              items: { $ref: "#/components/schemas/Consent" }
            relationships:
              type: array
              items: { $ref: "#/components/schemas/Relationship" }

    PersonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        nextBefore: { type: [string, "null"], format: uuid }

    CreatePersonRequest:
      type: object
      required: [displayName]
      description: At least one of `email` or `phone` is required (P-6).
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        givenName: { type: string, maxLength: 100 }
        familyName: { type: string, maxLength: 100 }
        birthDate: { type: string, format: date }
        email: { type: string, format: email }
        phone: { type: string, minLength: 6, maxLength: 20, examples: [050-1234567] }

    UpdatePersonRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        givenName: { type: [string, "null"], maxLength: 100 }
        familyName: { type: [string, "null"], maxLength: 100 }
        birthDate: { type: [string, "null"], format: date }
        status:
          type: string
          enum: [active, archived]

    UpdateMyProfileRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        givenName: { type: [string, "null"], maxLength: 100 }
        familyName: { type: [string, "null"], maxLength: 100 }
        birthDate: { type: [string, "null"], format: date }

    ContactPointType:
      type: string
      enum: [email, phone]

    ContactPoint:
      type: object
      required: [id, type, value, isPrimary, verified, version]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ContactPointType" }
        value: { type: string, description: "Email in lowercase, phone in E.164." }
        isPrimary: { type: boolean }
        verified: { type: boolean, description: The login's email; changes only with the account. }
        version: { type: string }

    CreateContactPointRequest:
      type: object
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/ContactPointType" }
        value: { type: string, minLength: 3, maxLength: 254 }
        isPrimary: { type: boolean, default: false }

    UpdateContactPointRequest:
      type: object
      minProperties: 1
      properties:
        value: { type: string, minLength: 3, maxLength: 254 }
        isPrimary: { type: boolean, const: true, description: Makes this the primary of its type. }

    ConsentPurpose:
      type: string
      enum: [marketing, reminders]

    ConsentChannel:
      type: string
      enum: [email, push, whatsapp]

    Consent:
      type: object
      required: [id, purpose, channel, state, method, textVersion, occurredAt]
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        channel: { $ref: "#/components/schemas/ConsentChannel" }
        state:
          type: string
          enum: [granted, withdrawn]
        method:
          type: string
          enum: [self, staff_on_behalf, import]
        textVersion: { type: string, description: The version of the consent text the person agreed to. }
        recordedBy: { $ref: "#/components/schemas/MemberRef" }
        occurredAt: { type: string, format: date-time }

    ConsentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Consent" }

    RecordConsentRequest:
      type: object
      required: [purpose, channel, state, textVersion]
      properties:
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        channel: { $ref: "#/components/schemas/ConsentChannel" }
        state:
          type: string
          enum: [granted, withdrawn]
        textVersion: { type: string, minLength: 1, maxLength: 40, examples: [marketing-he-2026-10] }

    RelationshipType:
      type: string
      enum: [guardian_of, emergency_contact_for]

    Relationship:
      type: object
      required: [id, type, fromPersonId, toPersonId, otherDisplayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/RelationshipType" }
        fromPersonId: { type: string, format: uuid }
        toPersonId: { type: string, format: uuid }
        otherDisplayName: { type: string, description: The name of the person on the other side. }
        createdAt: { type: string, format: date-time }

    CreateRelationshipRequest:
      type: object
      required: [type, toPersonId]
      description: "`{personId}` in the path is the `from` side: the guardian, or the emergency contact."
      properties:
        type: { $ref: "#/components/schemas/RelationshipType" }
        toPersonId: { type: string, format: uuid }

    InvitePersonRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, description: Where the person will sign in; added as a contact if new. }

    PersonExport:
      type: object
      required: [exportedAt, person, consentHistory, bookings, passes]
      properties:
        exportedAt: { type: string, format: date-time }
        organization:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        person: { $ref: "#/components/schemas/PersonDetail" }
        consentHistory:
          type: array
          items: { $ref: "#/components/schemas/Consent" }
        bookings:
          type: array
          description: Every booking of this person, in class order (docs/29 section 7).
          items: { $ref: "#/components/schemas/ExportBooking" }
        passes:
          type: array
          description: Every pass granted to this person, in start order. No staff note.
          items: { $ref: "#/components/schemas/ExportPass" }
        healthDeclarations:
          type: array
          description: Current and replaced declarations, oldest first (docs/31 section 11).
          items: { $ref: "#/components/schemas/ExportHealthDeclaration" }
        healthAnswersWithheld:
          type: boolean
          description: True when answers and names are null; `healthAnswersWithheldReason` says why.
        tags:
          type: array
          description: The names of the person's tags (docs/34 section 9). Sent once N1 is live.
          items: { type: string }
        notes:
          type: array
          description: Staff notes on the person, oldest first, the author by role only (docs/34 section 9). Sent once N1 is live.
          items: { $ref: "#/components/schemas/ExportNote" }
        healthAnswersWithheldReason:
          type: [string, "null"]
          enum: [no_health_view, health_key_unavailable, null]
          description: |
            `no_health_view` when the exporting member lacks `health.view`; `health_key_unavailable` when the health
            data key could not be read (docs/32 section 11, A-5): the rest of the export is complete. Null when the
            answers are included.

    ImportPeopleRequest:
      type: object
      required: [dryRun, rows]
      description: docs/34 section 4. Cells are sent as the file has them, trimmed; the API validates and normalizes.
      properties:
        dryRun: { type: boolean, description: True checks every row and writes nothing. }
        tagId:
          type: [string, "null"]
          format: uuid
          description: "Every person the import creates gets this tag (I-8, from I3). Must exist in the studio."
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ImportRow" }

    ImportRow:
      type: object
      required: [line]
      properties:
        line: { type: integer, minimum: 1, description: "The row's line in the file, echoed in the result." }
        displayName: { type: [string, "null"], maxLength: 100, description: "Empty means given and family names joined." }
        givenName: { type: [string, "null"], maxLength: 100 }
        familyName: { type: [string, "null"], maxLength: 100 }
        phone: { type: [string, "null"], maxLength: 40, examples: ["050-0000001"] }
        email: { type: [string, "null"], maxLength: 254 }
        birthDate:
          type: [string, "null"]
          maxLength: 20
          description: "`dd/mm/yyyy`, `d.m.yyyy` or `yyyy-mm-dd`, as the file has it."

    ImportPeopleResult:
      type: object
      required: [dryRun, totals, rows]
      properties:
        dryRun: { type: boolean }
        importId: { type: [string, "null"], format: uuid, description: "Null on a dry run; the id in the `people.imported` audit entry." }
        totals: { $ref: "#/components/schemas/ImportTotals" }
        rows:
          type: array
          description: One outcome per row, in the order sent.
          items: { $ref: "#/components/schemas/ImportRowResult" }

    ImportTotals:
      type: object
      required: [rows, valid, created, exists, duplicateInFile, invalid]
      properties:
        rows: { type: integer }
        valid: { type: integer, description: Rows that would be created (dry run) or were created. }
        created: { type: integer, description: Zero on a dry run. }
        exists: { type: integer }
        duplicateInFile: { type: integer }
        invalid: { type: integer }

    ImportRowResult:
      type: object
      required: [line, outcome]
      properties:
        line: { type: integer }
        outcome:
          type: string
          enum: [valid, created, exists, duplicate_in_file, invalid]
        personId:
          type: [string, "null"]
          format: uuid
          description: The created person (`created`) or the one already in the studio (`exists`).
        duplicateOfLine: { type: [integer, "null"], description: "`duplicate_in_file`: the earlier line." }
        possibleDuplicate:
          type: boolean
          description: "`valid` or `created`, but another person has the same name and birth date: flagged for the duplicates page, not merged."
        field:
          type: [string, "null"]
          enum: [display_name, phone, email, birth_date, contact, null]
          description: "`invalid`: the field at fault (`contact` when there is neither phone nor email)."
        code:
          type: [string, "null"]
          description: "`invalid`: `required`, `too_long`, `phone.invalid`, `email.invalid`, `birth_date.invalid` or `contact.required`."

    Tag:
      type: object
      required: [id, name, color, peopleCount, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 30, examples: [ייבוא 17.10] }
        color: { type: integer, minimum: 1, maximum: 6, description: One of six tones the design system draws. }
        peopleCount: { type: integer, description: People who have the tag now. }
        createdAt: { type: string, format: date-time }
        version: { type: string }

    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Tag" }

    CreateTagRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        color: { type: integer, minimum: 1, maximum: 6 }

    UpdateTagRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        color: { type: integer, minimum: 1, maximum: 6 }

    PersonTag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: integer, minimum: 1, maximum: 6 }

    PersonTagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PersonTag" }

    PersonNote:
      type: object
      required: [id, body, createdAt, authorRole, mine]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, minLength: 1, maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        authorMembershipId: { type: [string, "null"], format: uuid, description: Null once the author's membership is gone. }
        authorName: { type: [string, "null"], description: "The author's display name in this studio; null once their membership is gone." }
        authorRole: { type: string, description: "The author's system role when they wrote it: owner, admin or staff (a custom role shows as staff)." }
        mine: { type: boolean, description: The caller wrote it. }

    PersonNotePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PersonNote" }
        nextBefore: { type: [string, "null"], format: uuid }

    CreatePersonNoteRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }

    ExportNote:
      type: object
      required: [body, createdAt, authorRole]
      properties:
        body: { type: string }
        createdAt: { type: string, format: date-time }
        authorRole: { type: string, description: "The author by role, never by name (docs/34 section 9)." }

    ExportBooking:
      type: object
      required: [id, sessionId, className, startsAt, status, lateCancel, createdAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        className: { type: string, examples: [פילאטיס מכשירים] }
        startsAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/BookingStatus" }
        lateCancel: { type: boolean }
        cancelReason:
          type: [string, "null"]
          enum: [self, staff, session_cancelled, no_valid_pass, moved, null]
        createdAt: { type: string, format: date-time }

    ExportPass:
      type: object
      required: [id, productName, kind, startsOn, endsOn, entriesUsed, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        productName: { type: string, examples: [כרטיסיית 10] }
        kind: { $ref: "#/components/schemas/PassKind" }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        entries: { type: [integer, "null"] }
        entriesUsed: { type: integer }
        status: { type: string, enum: [active, voided] }
        createdAt: { type: string, format: date-time }

    DuplicateCandidate:
      type: object
      required: [id, reason, status, personA, personB, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        reason:
          type: string
          enum: [email, phone, name_birth_date]
        status:
          type: string
          enum: [open, merged, not_duplicate]
        personA: { $ref: "#/components/schemas/Person" }
        personB: { $ref: "#/components/schemas/Person" }
        createdAt: { type: string, format: date-time }
        version: { type: string }

    DuplicateCandidatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DuplicateCandidate" }
        nextBefore: { type: [string, "null"], format: uuid }

    ResolveDuplicateRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [merge, not_duplicate]
        survivorPersonId:
          type: string
          format: uuid
          description: Required when `resolution` is `merge`; one of the pair.

    # --- Studio scheduling and passes (docs/29) ---------------------------------------------------

    ClassColor:
      type: string
      description: A class color from the design system.
      enum: [sage, rose, taupe, amber, mauve, blue]

    LocalTime:
      type: string
      description: A wall-clock time in the studio's time zone, `HH:MM`.
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["17:30"]

    Room:
      type: object
      required: [id, name, defaultCapacity, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [חדר המכשירים] }
        defaultCapacity: { type: integer, minimum: 1, maximum: 500 }
        status: { type: string, enum: [active, archived] }
        version: { type: string }

    RoomList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Room" }

    CreateRoomRequest:
      type: object
      required: [name, defaultCapacity]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        defaultCapacity: { type: integer, minimum: 1, maximum: 500 }

    UpdateRoomRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        defaultCapacity: { type: integer, minimum: 1, maximum: 500 }
        status: { type: string, enum: [active, archived] }

    ClassType:
      type: object
      required: [id, name, category, color, defaultMinutes, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: [פילאטיס מכשירים] }
        category:
          type: string
          description: Groups class types for filters and for passes limited to one category.
          pattern: "^[a-z][a-z0-9_]{1,29}$"
          examples: [pilates]
        color: { $ref: "#/components/schemas/ClassColor" }
        defaultMinutes: { type: integer, minimum: 10, maximum: 300 }
        description: { type: [string, "null"], maxLength: 1000 }
        status: { type: string, enum: [active, archived] }
        version: { type: string }

    ClassTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClassType" }

    CreateClassTypeRequest:
      type: object
      required: [name, category, color, defaultMinutes]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        category: { type: string, pattern: "^[a-z][a-z0-9_]{1,29}$" }
        color: { $ref: "#/components/schemas/ClassColor" }
        defaultMinutes: { type: integer, minimum: 10, maximum: 300 }
        description: { type: string, maxLength: 1000 }

    UpdateClassTypeRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        category: { type: string, pattern: "^[a-z][a-z0-9_]{1,29}$" }
        color: { $ref: "#/components/schemas/ClassColor" }
        defaultMinutes: { type: integer, minimum: 10, maximum: 300 }
        description: { type: [string, "null"], maxLength: 1000 }
        status: { type: string, enum: [active, archived] }

    ScheduleTemplate:
      type: object
      description: A weekly class. `weekday` 0 is Sunday; times are in the studio's time zone.
      required: [id, classTypeId, weekday, localStart, minutes, capacity, validFrom, version, classType]
      properties:
        id: { type: string, format: uuid }
        classTypeId: { type: string, format: uuid }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        localStart: { $ref: "#/components/schemas/LocalTime" }
        minutes: { type: integer, minimum: 10, maximum: 300 }
        instructorMembershipId: { type: [string, "null"], format: uuid }
        roomId: { type: [string, "null"], format: uuid }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        validFrom: { type: string, format: date }
        validUntil: { type: [string, "null"], format: date }
        version: { type: string }
        classType:
          description: The class type as the console shows it in the weekly grid (same shape as `Session.classType`).
          type: object
          required: [id, name, category, color]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            category: { type: string }
            color: { $ref: "#/components/schemas/ClassColor" }
            description: { type: [string, "null"] }
        instructor:
          oneOf:
            - $ref: "#/components/schemas/InstructorRef"
            - type: "null"
        room:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - type: "null"

    ScheduleTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScheduleTemplate" }

    CreateScheduleTemplateRequest:
      type: object
      required: [classTypeId, weekday, localStart, capacity]
      properties:
        classTypeId: { type: string, format: uuid }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        localStart: { $ref: "#/components/schemas/LocalTime" }
        minutes:
          type: integer
          minimum: 10
          maximum: 300
          description: Defaults to the class type's `defaultMinutes`.
        instructorMembershipId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        validFrom:
          type: string
          format: date
          description: Defaults to today.
        validUntil: { type: string, format: date }

    UpdateScheduleTemplateRequest:
      type: object
      minProperties: 1
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        localStart: { $ref: "#/components/schemas/LocalTime" }
        minutes: { type: integer, minimum: 10, maximum: 300 }
        instructorMembershipId: { type: [string, "null"], format: uuid }
        roomId: { type: [string, "null"], format: uuid }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        validUntil:
          type: [string, "null"]
          format: date
          description: Ending a weekly class removes its future sessions that have no live bookings.

    ScheduleTemplateChange:
      type: object
      required: [template, untouchedSessions]
      properties:
        template: { $ref: "#/components/schemas/ScheduleTemplate" }
        untouchedSessions:
          type: array
          description: Future sessions that kept their old values because they have bookings; edit them one by one.
          items: { $ref: "#/components/schemas/Session" }

    SessionStatus:
      type: string
      enum: [scheduled, cancelled]

    InstructorRef:
      type: object
      required: [membershipId, displayName]
      properties:
        membershipId: { type: string, format: uuid }
        displayName: { type: string, examples: [דנה אלון] }

    MyBookingState:
      type: object
      description: The caller's own place in a session.
      required: [bookingId, status]
      properties:
        bookingId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        waitlistPosition:
          type: [integer, "null"]
          description: The caller's place in line (1 = next), counting only people still waiting.
        freeCancelUntil: { type: [string, "null"], format: date-time }

    Session:
      type: object
      required: [id, localDate, startsAt, endsAt, classType, capacity, bookedCount, waitlistCount, status, version]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: [string, "null"], format: uuid }
        localDate: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        classType:
          type: object
          required: [id, name, category, color]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            category: { type: string }
            color: { $ref: "#/components/schemas/ClassColor" }
            description: { type: [string, "null"], description: "About the class (AppClass)." }
        instructor:
          oneOf:
            - $ref: "#/components/schemas/InstructorRef"
            - type: "null"
        room:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - type: "null"
        capacity: { type: integer }
        bookedCount: { type: integer }
        waitlistCount: { type: integer }
        status: { $ref: "#/components/schemas/SessionStatus" }
        myBooking:
          description: The caller's booking or waitlist place; null when none.
          oneOf:
            - $ref: "#/components/schemas/MyBookingState"
            - type: "null"
        passPreview:
          description: The pass a booking by the caller would use now (docs/29 section 5.3); null when none is valid.
          oneOf:
            - $ref: "#/components/schemas/PassSummary"
            - type: "null"
        frozenUntil:
          type: [string, "null"]
          format: date
          description: |
            When no pass is valid because the caller's membership is frozen on this class's day (docs/29 section
            16.4): the last frozen day, so the booking sheet can say so before the 409. Null otherwise.
        version: { type: string }

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Session" }

    CreateSessionRequest:
      type: object
      required: [classTypeId, localDate, localStart, capacity]
      properties:
        classTypeId: { type: string, format: uuid }
        localDate: { type: string, format: date }
        localStart: { $ref: "#/components/schemas/LocalTime" }
        minutes: { type: integer, minimum: 10, maximum: 300 }
        instructorMembershipId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        capacity: { type: integer, minimum: 1, maximum: 500 }

    UpdateSessionRequest:
      type: object
      minProperties: 1
      properties:
        instructorMembershipId: { type: [string, "null"], format: uuid }
        roomId: { type: [string, "null"], format: uuid }
        capacity: { type: integer, minimum: 1, maximum: 500 }

    BookingStatus:
      type: string
      enum: [booked, waitlisted, cancelled, attended, no_show, removed, expired]

    PersonRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    Booking:
      type: object
      required: [id, sessionId, person, status, lateCancel, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        person: { $ref: "#/components/schemas/PersonRef" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        waitlistPosition: { type: [integer, "null"] }
        lateCancel: { type: boolean }
        cancelReason:
          type: [string, "null"]
          enum: [self, staff, session_cancelled, no_valid_pass, moved, null]
        cancelledFrom:
          type: [string, "null"]
          enum: [booked, waitlisted, null]
          description: For a cancelled booking, whether it held a place or a waitlist place; null otherwise.
        pass:
          description: |
            The pass this booking used, with its entries left now; still set after a cancellation (the entry may
            have returned). Null while waiting, and for a waitlist place that never got a seat.
          oneOf:
            - $ref: "#/components/schemas/PassSummary"
            - type: "null"
        createdAt: { type: string, format: date-time }
        version: { type: string }

    CreateBookingRequest:
      type: object
      properties:
        personId:
          type: string
          format: uuid
          description: Book someone else (`bookings.manage`). Omit to book yourself.

    MoveBookingRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string, format: uuid, description: The class the place moves to. }

    SendSessionMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500, examples: [החדר הוחלף לאולם הגדול, להביא מגבת] }

    SessionMessage:
      type: object
      required: [id, sessionId, recipients, createdAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        recipients: { type: integer, description: How many booked and waiting people got it. }
        createdAt: { type: string, format: date-time }

    CancelBookingRequest:
      type: object
      properties:
        returnEntry:
          type: boolean
          description: Staff only (`bookings.manage`), return the entry on a late cancellation.

    AttendanceRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [attended, no_show] }

    RosterEntry:
      type: object
      required: [bookingId, person, status, bookedAt]
      properties:
        bookingId: { type: string, format: uuid }
        person: { $ref: "#/components/schemas/PersonRef" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        waitlistPosition: { type: [integer, "null"] }
        passName: { type: [string, "null"], examples: [כרטיסיית 10] }
        entriesLeft:
          type: [integer, "null"]
          description: Entries left on the punch card this place holds, after it; null for a membership or when no pass is held (a waitlist place).
        healthStatus:
          description: The person's declaration status (docs/31 section 5); null when the caller lacks `people.view`.
          oneOf:
            - $ref: "#/components/schemas/HealthDeclarationStatus"
            - type: "null"
        bookedAt: { type: string, format: date-time }

    Roster:
      type: object
      required: [session, booked, waitlisted]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        booked:
          type: array
          description: Booked, attended and no-show places, in booking order.
          items: { $ref: "#/components/schemas/RosterEntry" }
        waitlisted:
          type: array
          description: In line order.
          items: { $ref: "#/components/schemas/RosterEntry" }

    MyBooking:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          required: [session]
          properties:
            session: { $ref: "#/components/schemas/Session" }

    MyBookingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MyBooking" }
        nextBefore: { type: [string, "null"], format: uuid }

    PassKind:
      type: string
      enum: [punch_card, membership]

    PassProduct:
      type: object
      required: [id, kind, name, validDays, status, version]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/PassKind" }
        name: { type: string, examples: [כרטיסיית 10 כניסות] }
        entries: { type: [integer, "null"], description: "Punch cards only." }
        validDays: { type: integer, minimum: 1, maximum: 730 }
        weeklyCap: { type: [integer, "null"], description: "Memberships only; null means unlimited." }
        classCategory: { type: [string, "null"], description: "Only class types of this category; null means all." }
        priceAgorot: { type: [integer, "null"], description: "Shown to staff only; nothing charges it yet." }
        status: { type: string, enum: [active, archived] }
        version: { type: string }

    PassProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PassProduct" }

    CreatePassProductRequest:
      type: object
      required: [kind, name, validDays]
      properties:
        kind: { $ref: "#/components/schemas/PassKind" }
        name: { type: string, minLength: 1, maxLength: 80 }
        entries: { type: integer, minimum: 1, maximum: 200, description: "Required for a punch card." }
        validDays: { type: integer, minimum: 1, maximum: 730 }
        weeklyCap: { type: integer, minimum: 1, maximum: 14, description: "Memberships only." }
        classCategory: { type: string, pattern: "^[a-z][a-z0-9_]{1,29}$" }
        priceAgorot: { type: integer, minimum: 0 }

    PassSummary:
      type: object
      required: [id, name, kind, endsOn]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PassKind" }
        endsOn: { type: string, format: date }
        entriesLeft: { type: [integer, "null"], description: "Punch cards only." }

    Pass:
      type: object
      required: [id, personId, product, startsOn, endsOn, entriesUsed, status, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        product:
          type: object
          required: [id, name, kind]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { $ref: "#/components/schemas/PassKind" }
            weeklyCap: { type: [integer, "null"] }
            classCategory: { type: [string, "null"] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        entries: { type: [integer, "null"] }
        entriesUsed: { type: integer }
        entriesLeft: { type: [integer, "null"] }
        note: { type: [string, "null"], maxLength: 200 }
        status: { type: string, enum: [active, voided, expired], description: "`expired` is computed from `endsOn`." }
        createdAt: { type: string, format: date-time }
        version: { type: string }
        freezes:
          type: array
          description: Frozen periods of a membership, in start order (docs/29 section 16.4); empty for a punch card. Always sent; optional here so sample data without it still types.
          items: { $ref: "#/components/schemas/PassFreeze" }

    PassFreeze:
      type: object
      required: [id, startsOn, endsOn]
      properties:
        id: { type: string, format: uuid }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }

    FreezePassRequest:
      type: object
      required: [startsOn, endsOn]
      properties:
        startsOn: { type: string, format: date, description: "Studio date, today or later." }
        endsOn: { type: string, format: date, description: "Inclusive; at most 90 days after startsOn." }

    PassList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Pass" }

    GrantPassRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: string, format: uuid }
        startsOn:
          type: string
          format: date
          description: Defaults to today in the studio's time zone.
        note: { type: string, maxLength: 200, examples: [שולם במזומן] }

    BookingPolicy:
      type: object
      required: [freeCancelHours, waitlistCutoffHours, bookingHorizonDays, waitlistEnabled, version]
      properties:
        freeCancelHours: { type: integer, minimum: 0, maximum: 72 }
        waitlistCutoffHours: { type: integer, minimum: 0, maximum: 24 }
        bookingHorizonDays: { type: integer, minimum: 1, maximum: 56 }
        waitlistEnabled: { type: boolean }
        requireHealthDeclaration:
          type: boolean
          description: >-
            docs/31 section 10. When true, a member's own booking or waitlist place needs a `signed` declaration, else
            409 `health.declaration_required`; staff booking for someone else is allowed and audited. Always sent
            since H2; optional in the schema only so older app fixtures keep compiling.
        version: { type: string }

    BookingPolicyInput:
      type: object
      required: [freeCancelHours, waitlistCutoffHours, bookingHorizonDays, waitlistEnabled]
      properties:
        freeCancelHours: { type: integer, minimum: 0, maximum: 72 }
        waitlistCutoffHours: { type: integer, minimum: 0, maximum: 24 }
        bookingHorizonDays: { type: integer, minimum: 1, maximum: 56 }
        waitlistEnabled: { type: boolean }
        requireHealthDeclaration:
          type: boolean
          description: docs/31 section 10. Left out keeps the current value; off by default.

    InboxItem:
      type: object
      required: [id, kind, data, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: Clients must ignore kinds they do not know.
          examples: [booking.promoted, booking.promotion_failed, booking.moved, session.message, session.cancelled, waitlist.expired, pass.frozen, reminder.class_tomorrow, reminder.class_soon, reminder.pass_ending, reminder.entries_low]
        data:
          type: object
          description: >-
            Ids only, and only the ones the kind carries; a key that does not apply is left out. Class kinds carry
            `sessionId` (and `bookingId` for a place); `pass.frozen`, `reminder.pass_ending` and
            `reminder.entries_low` carry `passId`.
          properties:
            sessionId: { type: string, format: uuid }
            bookingId: { type: string, format: uuid }
            passId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        text:
          type: [string, "null"]
          description: >-
            For `session.message`, the staff message (docs/29 section 16.2); for `studio.announcement` (docs/30
            step 7), the announcement's Markdown-light body. Null for every other kind.
        title:
          type: [string, "null"]
          description: >-
            The subject rendered from the studio's template (or the default) when the item was written (docs/30
            step 7); the announcement's subject for `studio.announcement`. Absent or null on older items and on
            `session.message`: show the app's own text for the kind.
        body:
          type: [string, "null"]
          description: >-
            The template's Markdown-light body with the variables filled when the item was written. A backslash
            escapes `\`, `*`, `[`, `]`, `(` and `)` that came from a value, so a name never bolds or links. Links
            are app paths (`/classes/{id}`, `/profile/notifications`). Absent or null on older items and on
            `session.message` / `studio.announcement` (see `text`).
        session:
          description: The class the notice is about, so a list needs no extra request; null when it has none.
          oneOf:
            - type: object
              required: [id, startsAt, classTypeName]
              properties:
                id: { type: string, format: uuid }
                startsAt: { type: string, format: date-time }
                classTypeName: { type: string }
            - type: "null"

    InboxPage:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
        unreadCount: { type: integer }
        nextBefore: { type: [string, "null"], format: uuid }

    # --- Notification preferences and push (docs/30, planned) -------------------------------------

    QuietHours:
      type: object
      required: [startsLocal, endsLocal]
      description: >-
        A window that may cross midnight (22:00 to 08:00). Reminders and studio messages wait until it ends; a
        notice about the member's own booking for a class that starts inside the window still goes out (D-4).
      properties:
        startsLocal: { $ref: "#/components/schemas/LocalTime" }
        endsLocal: { $ref: "#/components/schemas/LocalTime" }

    NotificationChannels:
      type: object
      required: [inbox, push]
      description: Email joins as an optional field once docs/30 D-1 is decided; clients must ignore unknown channels.
      properties:
        inbox: { type: boolean, description: Always true; the in-app inbox cannot be switched off. }
        push: { type: boolean }

    NotificationGroupPreference:
      type: object
      required: [group, channels]
      properties:
        group:
          type: string
          enum: [bookings, reminders, studio]
          description: "`bookings` are service notices about the member's own bookings (docs/30 section 5)."
        channels: { $ref: "#/components/schemas/NotificationChannels" }

    ReminderSwitches:
      type: object
      required: [classTomorrow, classSoon, passEnding, entriesLow]
      description: The member's own switch per reminder; a reminder the studio switched off never fires.
      properties:
        classTomorrow: { type: boolean }
        classSoon: { type: boolean }
        passEnding: { type: boolean }
        entriesLow: { type: boolean }

    NotificationPreferences:
      type: object
      required: [groups, reminders, quietHours, studioQuietHours, studioReminders, timeZone, version]
      properties:
        groups:
          type: array
          description: One row per group, always all three, in the order bookings, reminders, studio.
          items: { $ref: "#/components/schemas/NotificationGroupPreference" }
        reminders: { $ref: "#/components/schemas/ReminderSwitches" }
        quietHours:
          description: The member's own window; null means the studio's window applies.
          oneOf:
            - $ref: "#/components/schemas/QuietHours"
            - type: "null"
        studioQuietHours: { $ref: "#/components/schemas/QuietHours" }
        studioReminders:
          description: Which reminders the studio offers at all, so the settings page can hide the others.
          allOf:
            - $ref: "#/components/schemas/ReminderSwitches"
        timeZone: { type: string, description: "The studio's IANA time zone, e.g. Asia/Jerusalem." }
        version: { type: string }

    NotificationPreferencesInput:
      type: object
      required: [groups, reminders, quietHours]
      properties:
        groups:
          type: array
          minItems: 1
          maxItems: 3
          description: Groups left out keep their current channels.
          items: { $ref: "#/components/schemas/NotificationGroupPreference" }
        reminders: { $ref: "#/components/schemas/ReminderSwitches" }
        quietHours:
          oneOf:
            - $ref: "#/components/schemas/QuietHours"
            - type: "null"

    PushSubscription:
      type: object
      required: [id, deviceLabel, createdAt]
      description: The endpoint and keys are never returned.
      properties:
        id: { type: string, format: uuid }
        deviceLabel: { type: string, description: "What the settings page lists, e.g. \"Chrome, Android\"." }
        createdAt: { type: string, format: date-time }
        lastSuccessAt: { type: [string, "null"], format: date-time }

    PushSubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PushSubscription" }

    CreatePushSubscriptionRequest:
      type: object
      required: [endpoint, keys, deviceLabel]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 128, description: "Base64url, as the browser gives it." }
            auth: { type: string, maxLength: 64, description: "Base64url, as the browser gives it." }
        deviceLabel: { type: string, minLength: 1, maxLength: 60 }

    VapidPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string, description: "Base64url, uncompressed P-256 point (the `applicationServerKey`)." }

    ReminderTiming:
      type: object
      required: [classTomorrow, classSoon, passEnding, entriesLow]
      properties:
        classTomorrow:
          type: object
          required: [enabled, sendAtLocal]
          description: The evening before the class (D-5 default 18:00).
          properties:
            enabled: { type: boolean }
            sendAtLocal: { $ref: "#/components/schemas/LocalTime" }
        classSoon:
          type: object
          required: [enabled, hoursBefore]
          description: Before the class starts (D-5 default 2 hours).
          properties:
            enabled: { type: boolean }
            hoursBefore: { type: integer, minimum: 1, maximum: 12 }
        passEnding:
          type: object
          required: [enabled, daysBefore]
          description: Before a pass's last day (D-5 default 7 days).
          properties:
            enabled: { type: boolean }
            daysBefore: { type: integer, minimum: 1, maximum: 30 }
        entriesLow:
          type: object
          required: [enabled, entriesLeft]
          description: When a punch card reaches this many entries left (D-5 default 1).
          properties:
            enabled: { type: boolean }
            entriesLeft: { type: integer, minimum: 1, maximum: 5 }

    NotificationSettings:
      type: object
      required: [quietHours, reminders, timeZone, version]
      properties:
        quietHours: { $ref: "#/components/schemas/QuietHours" }
        reminders: { $ref: "#/components/schemas/ReminderTiming" }
        timeZone: { type: string }
        version: { type: string }

    NotificationSettingsInput:
      type: object
      required: [quietHours, reminders]
      properties:
        quietHours: { $ref: "#/components/schemas/QuietHours" }
        reminders: { $ref: "#/components/schemas/ReminderTiming" }

    NotificationGroup:
      type: string
      enum: [bookings, reminders, studio]

    NotificationTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, group, customized, updatedAt]
            properties:
              kind: { type: string, examples: [booking.promoted] }
              group: { $ref: "#/components/schemas/NotificationGroup" }
              customized:
                type: array
                description: The channels (in the default locale) where the studio has its own words.
                items: { type: string, enum: [inbox, push] }
              updatedAt: { type: [string, "null"], format: date-time }

    TemplateText:
      type: object
      required: [subject, body, source, studioVersion, preview]
      properties:
        subject: { type: string, description: "The inbox subject; the push title." }
        body:
          type: string
          description: >-
            Markdown-light (paragraphs split by a blank line, `**bold**`, `[text](link)`) with variables written
            `{{person.firstName}}`; `{{link.session}}` and `{{link.preferences}}` are app paths. Push shows the
            first paragraph without markup, cut at 120 characters.
        source: { type: string, enum: [default, studio] }
        studioVersion: { type: [integer, "null"], description: "The studio's active version; null on the default." }
        preview:
          type: object
          description: >-
            Rendered with `sampleValues`: `subject` is plain text; `body` is the Markdown-light text with the
            variables filled (inbox) or the plain push body of at most 120 characters (push).
          required: [subject, body]
          properties:
            subject: { type: string }
            body: { type: string }

    NotificationTemplate:
      type: object
      required: [kind, group, locale, variables, sampleValues, channels, version]
      properties:
        kind: { type: string }
        group: { $ref: "#/components/schemas/NotificationGroup" }
        locale: { type: string, enum: [he, en] }
        variables:
          type: array
          description: The closed list this kind may use (docs/30 section 6); anything else is refused on save.
          items: { type: string, examples: [person.firstName] }
        sampleValues:
          type: object
          description: The demo studio's value per variable, for a live preview while editing.
          additionalProperties: { type: string }
        channels:
          type: object
          required: [inbox, push]
          properties:
            inbox: { $ref: "#/components/schemas/TemplateText" }
            push: { $ref: "#/components/schemas/TemplateText" }
        version: { type: string, description: "Send back as If-Match." }

    TemplateTextInput:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 2000 }

    NotificationTemplateInput:
      type: object
      required: [locale, inbox, push]
      properties:
        locale: { type: string, enum: [he, en] }
        inbox:
          description: The studio's inbox words, or null for the platform default.
          oneOf:
            - $ref: "#/components/schemas/TemplateTextInput"
            - type: "null"
        push:
          description: The studio's push words, or null for the platform default.
          oneOf:
            - $ref: "#/components/schemas/TemplateTextInput"
            - type: "null"

    AnnouncementAllowance:
      type: object
      required: [recipients, maxRecipients, sentToday, dailyLimit]
      properties:
        recipients: { type: integer, description: "Active members right now." }
        maxRecipients: { type: integer, examples: [500] }
        sentToday: { type: integer, description: "In the studio's day (its time zone)." }
        dailyLimit: { type: integer, examples: [3] }

    AnnouncementInput:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 1000, description: "Markdown-light, no variables." }

    Announcement:
      type: object
      required: [id, recipients, sentAt, sentToday, dailyLimit]
      properties:
        id: { type: string, format: uuid }
        recipients: { type: integer }
        sentAt: { type: string, format: date-time }
        sentToday: { type: integer }
        dailyLimit: { type: integer }

    Delivery:
      type: object
      required: [id, kind, channel, status, reason, attempts, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        channel: { type: string, enum: [inbox, email, push] }
        status: { type: string, enum: [queued, sending, accepted, delivered, failed, retry_scheduled, dead, skipped] }
        reason:
          type: [string, "null"]
          description: >-
            The skip reason (`preference_off`, `quiet_hours`, `no_subscription`, `undeliverable`, `no_consent`,
            `channel_unavailable`) or the last error code (`http_403`, ...); null when there is none.
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/Delivery" }

    # --- Billing (docs/28) ------------------------------------------------------------------------

    SubscriptionState:
      type: string
      enum: [trialing, active, past_due, grace, restricted, canceled]

    Entitlements:
      type: object
      description: Entitlement keys and values from the plan and overrides, e.g. `rooms.max`. Ignore unknown keys.
      additionalProperties: true
      examples:
        - { rooms.max: 20, class_types.max: 50, staff.max: 10 }

    PlanVersion:
      type: object
      required: [id, planKey, displayName, priceMinor, currency, interval, entitlements]
      properties:
        id: { type: string, format: uuid }
        planKey: { type: string, examples: [pilot] }
        displayName: { type: string }
        priceMinor: { type: integer, description: "Agorot, VAT included (B-7)." }
        currency: { type: string, examples: [ILS] }
        interval: { type: string, enum: [month, year] }
        entitlements: { $ref: "#/components/schemas/Entitlements" }

    PlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanVersion" }

    BillingOverview:
      type: object
      required: [plan, state, provider, entitlements, version]
      properties:
        plan: { $ref: "#/components/schemas/PlanVersion" }
        state: { $ref: "#/components/schemas/SubscriptionState" }
        provider: { type: string, examples: [manual] }
        trialEndsAt: { type: [string, "null"], format: date-time }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        graceEndsAt: { type: [string, "null"], format: date-time }
        billingEmail: { type: [string, "null"], format: email }
        legalName: { type: [string, "null"] }
        businessId: { type: [string, "null"] }
        cardLast4: { type: [string, "null"] }
        entitlements: { $ref: "#/components/schemas/Entitlements" }
        version: { type: string }

    UpdateBillingAccountRequest:
      type: object
      minProperties: 1
      properties:
        billingEmail: { type: string, format: email, maxLength: 254 }
        legalName: { type: string, minLength: 1, maxLength: 120 }
        businessId: { type: string, pattern: "^[0-9]{9}$", description: "Israeli company or licensed-dealer number." }

    SetPlanRequest:
      type: object
      required: [planVersionId, reason]
      properties:
        planVersionId: { type: string, format: uuid }
        reason: { type: string, minLength: 5, maxLength: 500 }

    RecordPaymentRequest:
      type: object
      required: [amountMinor, method, reason]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        method: { type: string, enum: [transfer, cash, check, other] }
        reference: { type: string, maxLength: 100 }
        reason: { type: string, minLength: 5, maxLength: 500 }

    SetEntitlementOverrideRequest:
      type: object
      required: [value, reason]
      properties:
        value: { description: "A number, boolean or string, as the key defines." }
        reason: { type: string, minLength: 5, maxLength: 500 }
        endsAt: { type: [string, "null"], format: date-time }

    HealthDeclarationStatus:
      type: string
      enum: [missing, signed, needs_medical_approval, expired]
      description: docs/31 section 4. `signed` includes a "yes" with a recorded medical approval.

    HealthFormQuestion:
      type: object
      required: [id, text]
      properties:
        id: { type: string, pattern: "^q[0-9]{1,3}$", examples: [q1] }
        text: { type: string, description: The question in Hebrew; the platform's draft wording until the lawyer check (P-2). }

    HealthForm:
      type: object
      required: [version, locale, questions]
      properties:
        version: { type: integer, minimum: 1 }
        locale: { type: string, examples: [he-IL] }
        questions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/HealthFormQuestion" }

    HealthDeclarationStatusView:
      type: object
      required: [status]
      description: Status and dates only; never the answers or the names.
      properties:
        status: { $ref: "#/components/schemas/HealthDeclarationStatus" }
        declarationId: { type: [string, "null"], format: uuid, description: Null when the status is `missing`. }
        formVersion: { type: [integer, "null"] }
        signerRole: { type: [string, "null"], enum: [self, guardian, null] }
        signedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time, description: 12 months after `signedAt`. }
        medicalApprovalOn: { type: [string, "null"], format: date }

    MyHealthDeclaration:
      type: object
      required: [declaration, form, required]
      properties:
        declaration: { $ref: "#/components/schemas/HealthDeclarationStatusView" }
        form:
          $ref: "#/components/schemas/HealthForm"
          description: The current form, to sign or renew.
        required:
          type: boolean
          description: The studio's `requireHealthDeclaration`; when true, booking needs `signed`.

    HealthAnswer:
      type: object
      required: [questionId, answer]
      properties:
        questionId: { type: string, pattern: "^q[0-9]{1,3}$" }
        answer: { type: boolean, description: true is "yes". }

    SignHealthDeclarationRequest:
      type: object
      required: [formVersion, answers, signedName, signerRole, confirmed]
      properties:
        formVersion: { type: integer, minimum: 1 }
        answers:
          type: array
          description: One answer for every question of that version, no more.
          items: { $ref: "#/components/schemas/HealthAnswer" }
        signedName: { type: string, minLength: 2, maxLength: 100, description: "The member's full name, as typed." }
        signerRole: { type: string, enum: [self, guardian] }
        guardianName: { type: [string, "null"], minLength: 2, maxLength: 100, description: "The guardian who signs; required when `signerRole` is `guardian`." }
        confirmed: { type: boolean, const: true, description: The confirmation checkbox. }

    HealthDeclarationAnswers:
      type: object
      required: [declarationId, form, answers, signedName, signerRole, signedAt, expiresAt, status]
      properties:
        declarationId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/HealthDeclarationStatus" }
        form:
          $ref: "#/components/schemas/HealthForm"
          description: The version this declaration answered, which may be older than the current one.
        answers:
          type: array
          items: { $ref: "#/components/schemas/HealthAnswer" }
        signedName: { type: string }
        signerRole: { type: string, enum: [self, guardian] }
        guardianName: { type: [string, "null"] }
        signedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        medicalApprovalOn: { type: [string, "null"], format: date }

    MedicalApprovalRequest:
      type: object
      required: [approvedOn]
      properties:
        approvedOn: { type: string, format: date, description: Not in the future and not before the declaration was signed. }

    ExportHealthDeclaration:
      type: object
      required: [declarationId, formVersion, status, signerRole, signedAt, expiresAt]
      description: Answers and names only when the exporting member holds `health.view`; each such export is audited.
      properties:
        declarationId: { type: string, format: uuid }
        formVersion: { type: integer }
        status: { $ref: "#/components/schemas/HealthDeclarationStatus" }
        signerRole: { type: string, enum: [self, guardian] }
        signedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        supersededAt: { type: [string, "null"], format: date-time }
        medicalApprovalOn: { type: [string, "null"], format: date }
        answers:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/HealthAnswer" }
        signedName: { type: [string, "null"] }
        guardianName: { type: [string, "null"] }

    MyProgress:
      type: object
      required: [month, timeZone, visitsThisMonth, monthlyGoal, streakWeeks]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", examples: ["2026-10"], description: This month in the studio's time zone. }
        timeZone: { type: string, examples: [Asia/Jerusalem] }
        visitsThisMonth: { type: integer, minimum: 0, description: Attended classes that start this month. }
        monthlyGoal: { type: [integer, "null"], minimum: 1, maximum: 31, description: Null until the member sets one; the app hides the goal ring. }
        streakWeeks:
          type: integer
          minimum: 0
          description: Consecutive Sunday-to-Saturday weeks with an attended class; the current week counts once it has one.

    MonthlyGoalRequest:
      type: object
      required: [monthlyGoal]
      properties:
        monthlyGoal: { type: [integer, "null"], minimum: 1, maximum: 31, description: Null clears the goal. }

    DeleteMeRequest:
      type: object
      required: [confirmEmail]
      properties:
        confirmEmail:
          type: string
          maxLength: 320
          description: The account's email, typed by the person. Compared without case.

    DeleteOrganizationRequest:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string
          maxLength: 120
          description: The studio's name, typed by the operator. Compared exactly, after trimming.

    ReportFigures:
      type: object
      required: [sessionsHeld, capacity, placesBooked, attended, noShow, lateCancellations, fillRate]
      properties:
        sessionsHeld: { type: integer, minimum: 0, description: Sessions not cancelled that have started. }
        capacity: { type: integer, minimum: 0, description: The places those sessions offered. }
        placesBooked: { type: integer, minimum: 0, description: "Bookings on them that held a place: booked, attended or no_show." }
        attended: { type: integer, minimum: 0 }
        noShow: { type: integer, minimum: 0 }
        lateCancellations: { type: integer, minimum: 0, description: Cancelled by the member after the free-cancel window. }
        fillRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: attended / capacity, rounded to 3 places; null when no session was held.

    ReportTotals:
      allOf:
        - $ref: "#/components/schemas/ReportFigures"
        - type: object
          required: [activeMembers, newMembers]
          properties:
            activeMembers: { type: integer, minimum: 0, description: People with at least one attended class in the period. }
            newMembers: { type: integer, minimum: 0, description: People whose record was created in the period. }

    ReportWeek:
      allOf:
        - $ref: "#/components/schemas/ReportFigures"
        - type: object
          required: [weekStart, from, to]
          properties:
            weekStart: { type: string, format: date, description: The Sunday that starts the week. }
            from: { type: string, format: date, description: The first day of this week inside the period. }
            to: { type: string, format: date, description: The last day of this week inside the period. }

    ReportClassType:
      allOf:
        - $ref: "#/components/schemas/ReportFigures"
        - type: object
          required: [classTypeId, name, color]
          properties:
            classTypeId: { type: string, format: uuid }
            name: { type: string }
            color: { type: string, enum: [sage, rose, taupe, amber, mauve, blue] }

    ReportSummary:
      type: object
      required: [from, to, timeZone, totals, previous, weeks, classTypes]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timeZone: { type: string, examples: [Asia/Jerusalem] }
        totals: { $ref: "#/components/schemas/ReportTotals" }
        previous:
          description: The same figures for the period of the same length that ends the day before `from`, for the change on each tile.
          allOf:
            - $ref: "#/components/schemas/ReportTotals"
            - type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
        weeks:
          type: array
          description: Every Sunday-to-Saturday week that overlaps the period, oldest first, including weeks with nothing held.
          items: { $ref: "#/components/schemas/ReportWeek" }
        classTypes:
          type: array
          description: Class types with at least one session held in the period, by attended, most first.
          items: { $ref: "#/components/schemas/ReportClassType" }

    PassEndingRow:
      type: object
      required: [personId, displayName, passId, productName, kind, endsOn, entriesLeft, reason]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        passId: { type: string, format: uuid }
        productName: { type: string }
        kind: { type: string, enum: [punch_card, membership] }
        endsOn: { type: string, format: date }
        entriesLeft: { type: [integer, "null"], minimum: 0, description: Null for a membership. }
        reason:
          type: string
          enum: [ends_soon, last_entry]
          description: "`ends_soon` when it ends within 14 days (that wins when both apply), otherwise `last_entry`."

    PassesEndingReport:
      type: object
      required: [today, items, truncated]
      properties:
        today: { type: string, format: date, description: Today in the studio's time zone. }
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PassEndingRow" }
        truncated: { type: boolean, description: True when more than 50 passes match. }

    MemberAtRiskRow:
      type: object
      required: [personId, displayName, lastAttendedOn, passEndsOn]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        lastAttendedOn: { type: [string, "null"], format: date, description: Null when the person never attended. }
        passEndsOn: { type: string, format: date, description: The latest end among the person's valid passes. }

    MembersAtRiskReport:
      type: object
