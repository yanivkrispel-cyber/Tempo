    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Bookings]
      operationId: sendSessionMessage
      summary: "A short text to everyone registered on a class (`bookings.manage`, or the session's instructor)"
      description: |
        Reaches every `booked` and `waitlisted` person as an inbox item of kind `session.message` that carries the
        text (`InboxItem.text`). The audit log records that a message went out and to how many people, never the
        text. At most 5 messages per class per hour (409 `session.message_limit`); a cancelled class, or one that
        ended more than a day ago, answers 409 `booking.closed`. No push, SMS or email in this step (docs/30).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendSessionMessageRequest" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Restricted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

