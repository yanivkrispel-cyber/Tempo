openapi: 3.1.0
info:
  title: Tempo API
  version: 1.1.0-phase2
  summary: Phase 1 and 2 - accounts, studios, memberships, invitations, audit, roles and permissions, people.
  description: |
    Source of truth for the Phase 1 API (docs/26_Identity_Organization_Membership_LLD.md, section 8) and the
    Phase 2 additions (docs/27_Authorization_and_People_LLD.md, section 6). Frontends generate their client
    from this file. Phase 2 is additive: every Phase 1 field stays (`role` on memberships stays one release).

    **Permissions.** Every studio route checks one permission key (docs/27 section 3.1); the operation summary
    names it. Apps read `permissions` from `GET /me` to show or hide actions; the API is the only enforcement.

    **Recent sign-in.** Privileged actions (owner transfer, assigning `admin`, export, erase) need a sign-in
    within the last 10 minutes; otherwise 401 `auth.step_up_required`, and the app sends the user through
    sign-in again.

    **Tokens.** Send a Cognito *access* token as `Authorization: Bearer <token>`. Behind CloudFront the
    same value goes in `X-Tempo-Authorization`, because CloudFront's origin access control replaces
    `Authorization`. Customer-pool tokens work on every route except `/api/v1/platform/*`, which accepts
    only operator-pool tokens (ADR-0023).

    **Errors.** Every error is Problem Details (`application/problem+json`) with a stable `code`.

    **Lists.** Keyset pagination: pass the last item's `id` as `before`; `limit` is 1 to 100 (default 50).
  license:
    name: Proprietary
    identifier: LicenseRef-Tempo-Proprietary
servers:
  - url: https://2a5q3fao7a.execute-api.eu-central-1.amazonaws.com
    description: Development
security:
  - customerToken: []
tags:
  - name: Health
    description: Liveness, no authentication.
  - name: Account
    description: The signed-in person, before any studio is chosen.
  - name: Joining
    description: Accepting an invitation or a studio join link.
  - name: Organizations
    description: A studio and its settings.
  - name: Members
    description: People who belong to a studio, with their role.
  - name: Invitations
    description: Email-bound invitations for admins, staff and clients.
  - name: Join link
    description: The studio's link for clients to join on their own.
  - name: Audit
    description: Who changed what in a studio.
  - name: Roles
    description: Roles, the permission catalog and a member's role set.
  - name: Ownership
    description: Handing a studio to another admin.
  - name: People
    description: The studio's person records, with or without a login.
  - name: My profile
    description: The caller's own person record and consent in one studio.
  - name: Platform
    description: The Tempo team's console. Operator-pool tokens only.

paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Problem" }

  /api/v1/session:
    post:
      tags: [Account]
      operationId: startSession
      summary: Create or refresh the caller's Tempo account
      description: |
        Call once after every sign-in. Creates the account on first use and refreshes email and
        verification from Cognito. Idempotent.
      responses:
        "200":
          description: The account and its studios.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The caller's account and studios
      responses:
        "200":
          description: The account and its studios.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`account.not_provisioned`: call `POST /api/v1/session` first."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update display name or locale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Open a new studio; the caller becomes its owner
      description: Needs a verified email. At most 3 studios per account (`organization.creation_limit`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: URL of the new studio.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations/preview:
    post:
      tags: [Joining]
      operationId: previewInvitation
      summary: Show what an invitation is for, without accepting it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/invitations/accept:
    post:
      tags: [Joining]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: The caller's verified email must match the invitation. Accepting twice returns the same membership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: "`invitation.expired`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/join/preview:
    post:
      tags: [Joining]
      operationId: previewJoin
      summary: Show which studio a join link belongs to
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinCodeRequest" }
      responses:
        "200":
          description: The studio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/join:
    post:
      tags: [Joining]
      operationId: joinOrganization
      summary: Join a studio as a client through its join link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinCodeRequest" }
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: A studio the caller belongs to
      responses:
        "200":
          description: The studio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Change studio settings (owner, admin)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Members]
      operationId: listMembers
      summary: The studio's members (owner, admin, staff)
      parameters:
        - name: role
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MembershipStatus" }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/MembershipId"
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Change a member's role or suspend and reactivate them
      description: |
        Owners can change anyone but themselves; admins only staff and clients. The owner role cannot be
        granted here (`membership.forbidden_role_change`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member, or leave the studio when it is your own membership
      description: The owner cannot leave (`membership.owner_cannot_leave`).
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: Pending and past invitations (owner, admin)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/InvitationStatus" }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of invitations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Invite someone by email (owner, admin)
      description: |
        Returns the invitation link once; it is not stored and cannot be shown again. Until Tempo can send
        email, the inviter shares the link (LLD open question O-1). A new invitation to the same email
        revokes the previous pending one. Admins cannot invite admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoke a pending invitation (owner, admin)
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/join-link:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    put:
      tags: [Join link]
      operationId: rotateJoinLink
      summary: Create the studio's join link, or replace it (owner, admin)
      description: The previous link stops working at once. The link is returned only here.
      responses:
        "200":
          description: The new link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Join link]
      operationId: disableJoinLink
      summary: Turn the join link off (owner, admin)
      responses:
        "204":
          description: Disabled.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/audit-events:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: The studio's audit log, newest first (owner, admin)
      parameters:
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/organizations:
    get:
      tags: [Platform]
      operationId: platformListOrganizations
      summary: All studios
      security:
        - operatorToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/OrganizationStatus" }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of studios.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganizationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/platform/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Platform]
      operationId: platformGetOrganization
      summary: One studio, with its owner and member counts (audited)
      security:
        - operatorToken: []
      responses:
        "200":
          description: The studio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/organizations/{organizationId}/suspend:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Platform]
      operationId: platformSuspendOrganization
      summary: Suspend a studio
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/organizations/{organizationId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Platform]
      operationId: platformReactivateOrganization
      summary: Reactivate a suspended studio
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Reactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/stats:
    get:
      tags: [Platform]
      operationId: platformGetStats
      summary: Counts for the console home page
      security:
        - operatorToken: []
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/organizations/{organizationId}/me/profile:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [My profile]
      operationId: getMyProfile
      summary: The caller's own person record in this studio, with contacts and consent
      description: Any active member. Uses the self rule, so no `people.*` permission is needed.
      responses:
        "200":
          description: The caller's person record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [My profile]
      operationId: updateMyProfile
      summary: Edit the caller's own name and birth date in this studio
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMyProfileRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/me/consents:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [My profile]
      operationId: recordMyConsent
      summary: Grant or withdraw one of the caller's own consents
      description: Appends a row with `method = self`; the current state is the latest row (docs/27 section 4.3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordConsentRequest" }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/roles:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Roles]
      operationId: listRoles
      summary: The roles a member can hold in this studio (`members.view`)
      description: The four system roles, plus the studio's custom roles once they exist (system roles only in Phase 2, A-1).
      responses:
        "200":
          description: All roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/permissions:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Roles]
      operationId: listPermissions
      summary: The permission catalog, for the role screen (`roles.manage`)
      responses:
        "200":
          description: Every permission key with its description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/members/{membershipId}/roles:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/MembershipId"
    put:
      tags: [Roles]
      operationId: setMemberRoles
      summary: Replace a member's full set of roles (`members.manage` or `roles.manage`)
      description: |
        The rank rule applies: without `roles.manage` you can assign only roles whose permissions you hold
        yourself (`role.exceeds_actor`). Nobody can assign `owner` (`membership.forbidden_role_change`); use an
        owner transfer. Nobody can change their own roles. Granting `admin` needs a recent sign-in
        (`auth.step_up_required`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMemberRolesRequest" }
      responses:
        "200":
          description: The member with the new roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/StepUpOrUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/ownership-transfer:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Ownership]
      operationId: getOwnershipTransfer
      summary: The pending owner transfer, if any (owner, or its target)
      responses:
        "200":
          description: The pending transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipTransfer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`ownership.transfer_not_found`: nothing pending."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      tags: [Ownership]
      operationId: startOwnershipTransfer
      summary: Offer the studio to an active admin (`ownership.transfer`, recent sign-in)
      description: The target accepts within 72 hours. One pending transfer per studio (`ownership.transfer_pending`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartOwnershipTransferRequest" }
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipTransfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/StepUpOrUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Ownership]
      operationId: cancelOwnershipTransfer
      summary: Cancel the pending transfer (the owner)
      responses:
        "204":
          description: Cancelled.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/ownership-transfer/accept:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Ownership]
      operationId: acceptOwnershipTransfer
      summary: Accept the studio (the target member)
      description: In one transaction the caller becomes `owner` and the previous owner becomes `admin`.
      responses:
        "200":
          description: The caller's membership, now owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: "`ownership.transfer_expired`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/organizations/{organizationId}/ownership-transfer/decline:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Ownership]
      operationId: declineOwnershipTransfer
      summary: Decline the studio (the target member)
      responses:
        "204":
          description: Declined.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [People]
      operationId: listPeople
      summary: The studio's person records (`people.view`)
      parameters:
        - name: query
          in: query
          required: false
          description: Matches name, email or phone (any part).
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PersonStatus" }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of people.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [People]
      operationId: createPerson
      summary: Record a person without a login, e.g. a walk-in (`people.manage`)
      description: Needs a display name and at least one phone or email (P-6). Possible duplicates are flagged, never merged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePersonRequest" }
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: URL of the new person.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people/{personId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [People]
      operationId: getPerson
      summary: One person with contacts, current consent and relationships (`people.view`)
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [People]
      operationId: updatePerson
      summary: Edit a person's name, birth date or status (`people.manage`)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePersonRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/people/{personId}/contact-points:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    post:
      tags: [People]
      operationId: addContactPoint
      summary: Add an email or phone (`people.manage`)
      description: Israeli local phones (`050-1234567`) are stored as E.164; an invalid number is `contact_point.invalid_phone`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactPointRequest" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people/{personId}/contact-points/{contactPointId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
      - name: contactPointId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [People]
      operationId: updateContactPoint
      summary: Change a contact's value or make it primary (`people.manage`)
      description: A verified contact (the login's email) cannot be edited here.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContactPointRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [People]
      operationId: deleteContactPoint
      summary: Remove a contact (`people.manage`)
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people/{personId}/consents:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [People]
      operationId: listConsentHistory
      summary: Every consent row for a person, newest first (`people.view`)
      responses:
        "200":
          description: The full history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [People]
      operationId: recordConsentOnBehalf
      summary: Record consent from a paper form (`consent.manage`)
      description: Appends a row with `method = staff_on_behalf`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordConsentRequest" }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people/{personId}/relationships:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    post:
      tags: [People]
      operationId: addRelationship
      summary: Link this person to another, e.g. guardian of a child (`people.manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRelationshipRequest" }
      responses:
        "201":
          description: Linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relationship" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people/{personId}/relationships/{relationshipId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
      - name: relationshipId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [People]
      operationId: deleteRelationship
      summary: Remove a link (`people.manage`)
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people/{personId}/invite:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    post:
      tags: [People]
      operationId: invitePerson
      summary: Invite a recorded person to the app as a client (`members.invite.staff`)
      description: |
        Creates an invitation that carries `personId`, so accepting it links the login to this record instead of
        creating a new one. The person must have no login (`person.has_login`). The link is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitePersonRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/people/{personId}/export:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    post:
      tags: [People]
      operationId: exportPerson
      summary: Everything the studio holds about one person, as JSON (`people.export`, recent sign-in)
      responses:
        "200":
          description: The export. Audited; not stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonExport" }
        "401": { $ref: "#/components/responses/StepUpOrUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/people/{personId}/erase:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PersonId"
    post:
      tags: [People]
      operationId: erasePerson
      summary: Anonymize a person (`people.erase`, recent sign-in)
      description: |
        Names, contacts and birth date are removed, the login is unlinked and `status` becomes `anonymized`.
        Consent states and timestamps stay as proof. Cannot be undone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Anonymized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/StepUpOrUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/duplicate-candidates:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [People]
      operationId: listDuplicateCandidates
      summary: Pairs of people that may be the same human (`people.merge`)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, merged, not_duplicate]
            default: open
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of candidates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateCandidatePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationId}/duplicate-candidates/{candidateId}/resolve:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [People]
      operationId: resolveDuplicateCandidate
      summary: Merge the pair into one record, or mark it as two people (`people.merge`)
      description: Two records that both have a login cannot be merged (`person.merge_both_have_login`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveDuplicateRequest" }
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateCandidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/platform/organizations/{organizationId}/force-owner-transfer:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Platform]
      operationId: platformForceOwnerTransfer
      summary: Make an active admin the owner when the owner is unreachable (audited)
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForceOwnerTransferRequest" }
      responses:
        "200":
          description: Transferred.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOrganization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    customerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the customer pool `tempo-{env}-users`.
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the operator pool `tempo-{env}-operators` (MFA required).

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Before:
      name: before
      in: query
      required: false
      description: The `id` of the last item on the previous page.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `version` you last read. A stale value returns 409 `concurrency.conflict`.
      schema: { type: string }

  responses:
    Problem:
      description: Unexpected error.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: |
        Validation failed; `errors` lists the fields. Phase 2 codes include `contact.required`,
        `contact_point.invalid_phone`, `contact_point.invalid_email`, `consent.invalid`, `role_ids.required`,
        `role_ids.single`, `role.not_found`, `relationship.invalid_type`, `relationship.self`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, invalid or wrong-pool token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StepUpOrUnauthorized:
      description: |
        Missing, invalid or wrong-pool token, or `auth.step_up_required`: the action needs a sign-in within the
        last 10 minutes.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        Signed in but not allowed, for example `permission.denied` (the caller lacks the route's permission),
        `account.disabled`, `account.email_not_verified`, `membership.suspended`, `organization.suspended`,
        `invitation.email_mismatch`, `operator.not_registered`, `auth.mfa_required`, `role.exceeds_actor`,
        `membership.forbidden_role_change`, `ownership.target_not_admin`, `status.not_allowed`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: |
        Not found, or not visible to the caller. A studio the caller does not belong to is also 404
        (`organization.not_found`), so ids cannot be probed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        `organization.slug_taken`, `organization.creation_limit`, `concurrency.conflict`,
        `ownership.transfer_pending`, `ownership.transfer_stale` (roles changed since the offer; it is cancelled),
        `person.has_login`, `person.merge_both_have_login`, `person.read_only` (anonymized or merged),
        `contact_point.verified` (the sign-in email changes only with the account), `relationship.exists`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many requests. Invitation and join calls allow 20 per account per hour; other routes are limited at the edge.
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code, e.g. `membership.not_found`.
          examples: [organization.not_found]
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    Health:
      type: object
      required: [status, environment, version, timestamp, correlationId]
      properties:
        status: { type: string, examples: [healthy] }
        environment: { type: string }
        version: { type: string }
        timestamp: { type: string, format: date-time }
        correlationId: { type: string }

    Role:
      type: string
      enum: [owner, admin, staff, client]
    MembershipStatus:
      type: string
      enum: [invited, active, suspended, removed]
    OrganizationStatus:
      type: string
      enum: [active, suspended]
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    InvitableRole:
      type: string
      enum: [admin, staff, client]

    Me:
      type: object
      required: [id, email, emailVerified, locale, status, memberships]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        displayName: { type: [string, "null"] }
        locale: { type: string, examples: [he-IL] }
        status:
          type: string
          enum: [active, disabled]
        memberships:
          type: array
          items: { $ref: "#/components/schemas/MyMembership" }

    MyMembership:
      type: object
      description: One studio the caller belongs to, for the studio switcher.
      required: [membershipId, role, roles, permissions, status, organization]
      properties:
        membershipId: { type: string, format: uuid }
        role:
          $ref: "#/components/schemas/Role"
          deprecated: true
          description: Phase 1 field, kept one release. Read `roles` and `permissions` instead.
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleSummary" }
        permissions:
          type: array
          description: The union of the permissions of the caller's live roles in this studio.
          items: { $ref: "#/components/schemas/PermissionKey" }
        pendingOwnershipTransfer:
          oneOf:
            - $ref: "#/components/schemas/PendingOwnershipTransfer"
            - type: "null"
        status: { $ref: "#/components/schemas/MembershipStatus" }
        organization:
          type: object
          required: [id, slug, displayName, status]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            displayName: { type: string }
            status: { $ref: "#/components/schemas/OrganizationStatus" }

    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        locale:
          type: string
          enum: [he-IL, en-US]

    Slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
      description: Lowercase Latin letters, digits and hyphens, 3 to 40 characters.
      examples: [studio-neshima]

    Organization:
      type: object
      required: [id, slug, displayName, status, countryCode, defaultLocale, timeZone, currencyCode, joinLinkEnabled, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: "#/components/schemas/Slug" }
        displayName: { type: string, examples: [סטודיו נשימה] }
        status: { $ref: "#/components/schemas/OrganizationStatus" }
        countryCode: { type: string, examples: [IL] }
        defaultLocale: { type: string, examples: [he-IL] }
        timeZone: { type: string, examples: [Asia/Jerusalem] }
        currencyCode: { type: string, examples: [ILS] }
        joinLinkEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        version: { type: string, description: Send back in `If-Match` when updating. }

    CreateOrganizationRequest:
      type: object
      required: [displayName, slug]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        slug: { $ref: "#/components/schemas/Slug" }
        timeZone: { type: string, default: Asia/Jerusalem }
        defaultLocale: { type: string, default: he-IL }

    UpdateOrganizationRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        timeZone: { type: string }
        defaultLocale: { type: string }

    Member:
      type: object
      required: [id, userAccountId, email, role, roles, status, joinedAt, version]
      properties:
        id: { type: string, format: uuid, description: The membership id. }
        userAccountId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: [string, "null"] }
        role:
          $ref: "#/components/schemas/Role"
          deprecated: true
          description: Phase 1 field, kept one release. Read `roles` instead.
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleSummary" }
        personId: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/MembershipStatus" }
        joinedAt: { type: string, format: date-time }
        version: { type: string }

    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        nextBefore: { type: [string, "null"], format: uuid }

    UpdateMemberRequest:
      type: object
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/InvitableRole" }
        status:
          type: string
          enum: [active, suspended]

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/InvitableRole" }

    Invitation:
      type: object
      required: [id, email, role, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/InvitableRole" }
        status: { $ref: "#/components/schemas/InvitationStatus" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        invitedBy:
          type: object
          required: [membershipId]
          properties:
            membershipId: { type: string, format: uuid }
            displayName: { type: [string, "null"] }

    CreatedInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [link]
          properties:
            link:
              type: string
              format: uri
              description: |
                Shown once, as `https://<app>/invite#<token>`. The token is in the fragment, which browsers never
                send to a server; the app reads it and sends it in the body of preview and accept.

    InvitationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        nextBefore: { type: [string, "null"], format: uuid }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 100 }

    InvitationPreview:
      type: object
      required: [organization, role, expiresAt]
      properties:
        organization:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        role: { $ref: "#/components/schemas/InvitableRole" }
        invitedByDisplayName: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }

    JoinCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 16, maxLength: 64 }

    JoinPreview:
      type: object
      required: [organization]
      properties:
        organization:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }

    JoinLink:
      type: object
      required: [link, createdAt]
      properties:
        link:
          type: string
          format: uri
          description: |
            `https://<client app>/join#<code>`. The code is in the fragment; the app sends it in the body of
            join preview and join.
        createdAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, occurredAt, actorType, action, targetType]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorType:
          type: string
          enum: [user, operator, system]
        actorDisplayName: { type: [string, "null"] }
        action: { type: string, examples: [membership.role_changed] }
        targetType: { type: string, examples: [membership] }
        targetId: { type: [string, "null"], format: uuid }
        data:
          type: object
          additionalProperties: true

    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        nextBefore: { type: [string, "null"], format: uuid }

    PlatformOrganization:
      type: object
      required: [id, slug, displayName, status, createdAt, owner, memberCounts]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        displayName: { type: string }
        status: { $ref: "#/components/schemas/OrganizationStatus" }
        createdAt: { type: string, format: date-time }
        owner:
          type: object
          required: [userAccountId, email]
          properties:
            userAccountId: { type: string, format: uuid }
            email: { type: string, format: email }
            displayName: { type: [string, "null"] }
        memberCounts:
          type: object
          required: [owner, admin, staff, client]
          properties:
            owner: { type: integer }
            admin: { type: integer }
            staff: { type: integer }
            client: { type: integer }

    PlatformOrganizationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformOrganization" }
        nextBefore: { type: [string, "null"], format: uuid }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }

    PlatformStats:
      type: object
      required: [activeOrganizations, suspendedOrganizations, accounts, activeMemberships, hourlyBackupThreshold]
      properties:
        activeOrganizations: { type: integer }
        suspendedOrganizations: { type: integer }
        accounts: { type: integer }
        activeMemberships: { type: integer }
        hourlyBackupThreshold:
          type: integer
          description: Active studios at which the owner is alerted to move to hourly backups (ADR-0021).
          examples: [10]

    PermissionKey:
      type: string
      description: |
        A stable key from the permission catalog (docs/27 section 3.1). New keys can appear in later phases, so
        clients must ignore keys they do not know.
      examples: [members.view, people.manage]

    RoleSummary:
      type: object
      required: [id, key, displayName, isSystem]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, examples: [admin] }
        displayName: { type: string, examples: [מנהל] }
        isSystem: { type: boolean }

    RoleDetail:
      allOf:
        - $ref: "#/components/schemas/RoleSummary"
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items: { $ref: "#/components/schemas/PermissionKey" }

    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoleDetail" }

    Permission:
      type: object
      required: [key, description]
      properties:
        key: { $ref: "#/components/schemas/PermissionKey" }
        description: { type: string }

    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    SetMemberRolesRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }

    OwnershipTransferStatus:
      type: string
      enum: [pending, accepted, declined, cancelled, expired]

    OwnershipTransfer:
      type: object
      required: [id, status, from, to, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OwnershipTransferStatus" }
        from: { $ref: "#/components/schemas/MemberRef" }
        to: { $ref: "#/components/schemas/MemberRef" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PendingOwnershipTransfer:
      type: object
      description: Shown on the membership of the owner who offered the studio and of the admin who can accept it.
      required: [id, direction, expiresAt]
      properties:
        id: { type: string, format: uuid }
        direction:
          type: string
          enum: [outgoing, incoming]
        expiresAt: { type: string, format: date-time }

    MemberRef:
      type: object
      required: [membershipId]
      properties:
        membershipId: { type: string, format: uuid }
        displayName: { type: [string, "null"] }

    StartOwnershipTransferRequest:
      type: object
      required: [toMembershipId]
      properties:
        toMembershipId: { type: string, format: uuid }

    ForceOwnerTransferRequest:
      type: object
      required: [toMembershipId, reason, ticket]
      properties:
        toMembershipId: { type: string, format: uuid }
        reason: { type: string, minLength: 5, maxLength: 500 }
        ticket: { type: string, minLength: 1, maxLength: 100, description: Support ticket reference. }

    PersonStatus:
      type: string
      enum: [active, archived, anonymized, merged]

    PersonSource:
      type: string
      description: "`organization_created` is the owner who opened the studio."
      enum: [organization_created, join_link, invitation, staff_created, import]

    Person:
      type: object
      required: [id, displayName, status, source, hasLogin, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, examples: [נועה לוי] }
        givenName: { type: [string, "null"] }
        familyName: { type: [string, "null"] }
        birthDate: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/PersonStatus" }
        source: { $ref: "#/components/schemas/PersonSource" }
        hasLogin: { type: boolean }
        membershipId: { type: [string, "null"], format: uuid }
        primaryEmail: { type: [string, "null"], format: email }
        primaryPhone: { type: [string, "null"], description: E.164, examples: ["+972501234567"] }
        mergedIntoId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        version: { type: string, description: Send back in `If-Match` when updating. }

    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [contactPoints, consents, relationships]
          properties:
            contactPoints:
              type: array
              items: { $ref: "#/components/schemas/ContactPoint" }
            consents:
              type: array
              description: The current state per purpose and channel (the latest row of each).
              items: { $ref: "#/components/schemas/Consent" }
            relationships:
              type: array
              items: { $ref: "#/components/schemas/Relationship" }

    PersonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        nextBefore: { type: [string, "null"], format: uuid }

    CreatePersonRequest:
      type: object
      required: [displayName]
      description: At least one of `email` or `phone` is required (P-6).
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        givenName: { type: string, maxLength: 100 }
        familyName: { type: string, maxLength: 100 }
        birthDate: { type: string, format: date }
        email: { type: string, format: email }
        phone: { type: string, minLength: 6, maxLength: 20, examples: [050-1234567] }

    UpdatePersonRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        givenName: { type: [string, "null"], maxLength: 100 }
        familyName: { type: [string, "null"], maxLength: 100 }
        birthDate: { type: [string, "null"], format: date }
        status:
          type: string
          enum: [active, archived]

    UpdateMyProfileRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        givenName: { type: [string, "null"], maxLength: 100 }
        familyName: { type: [string, "null"], maxLength: 100 }
        birthDate: { type: [string, "null"], format: date }

    ContactPointType:
      type: string
      enum: [email, phone]

    ContactPoint:
      type: object
      required: [id, type, value, isPrimary, verified, version]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ContactPointType" }
        value: { type: string, description: "Email in lowercase, phone in E.164." }
        isPrimary: { type: boolean }
        verified: { type: boolean, description: The login's email; changes only with the account. }
        version: { type: string }

    CreateContactPointRequest:
      type: object
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/ContactPointType" }
        value: { type: string, minLength: 3, maxLength: 254 }
        isPrimary: { type: boolean, default: false }

    UpdateContactPointRequest:
      type: object
      minProperties: 1
      properties:
        value: { type: string, minLength: 3, maxLength: 254 }
        isPrimary: { type: boolean, const: true, description: Makes this the primary of its type. }

    ConsentPurpose:
      type: string
      enum: [marketing, reminders]

    ConsentChannel:
      type: string
      enum: [email, push, whatsapp]

    Consent:
      type: object
      required: [id, purpose, channel, state, method, textVersion, occurredAt]
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        channel: { $ref: "#/components/schemas/ConsentChannel" }
        state:
          type: string
          enum: [granted, withdrawn]
        method:
          type: string
          enum: [self, staff_on_behalf, import]
        textVersion: { type: string, description: The version of the consent text the person agreed to. }
        recordedBy: { $ref: "#/components/schemas/MemberRef" }
        occurredAt: { type: string, format: date-time }

    ConsentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Consent" }

    RecordConsentRequest:
      type: object
      required: [purpose, channel, state, textVersion]
      properties:
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        channel: { $ref: "#/components/schemas/ConsentChannel" }
        state:
          type: string
          enum: [granted, withdrawn]
        textVersion: { type: string, minLength: 1, maxLength: 40, examples: [marketing-he-2026-10] }

    RelationshipType:
      type: string
      enum: [guardian_of, emergency_contact_for]

    Relationship:
      type: object
      required: [id, type, fromPersonId, toPersonId, otherDisplayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/RelationshipType" }
        fromPersonId: { type: string, format: uuid }
        toPersonId: { type: string, format: uuid }
        otherDisplayName: { type: string, description: The name of the person on the other side. }
        createdAt: { type: string, format: date-time }

    CreateRelationshipRequest:
      type: object
      required: [type, toPersonId]
      description: "`{personId}` in the path is the `from` side: the guardian, or the emergency contact."
      properties:
        type: { $ref: "#/components/schemas/RelationshipType" }
        toPersonId: { type: string, format: uuid }

    InvitePersonRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, description: Where the person will sign in; added as a contact if new. }

    PersonExport:
      type: object
      required: [exportedAt, person, consentHistory]
      properties:
        exportedAt: { type: string, format: date-time }
        organization:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        person: { $ref: "#/components/schemas/PersonDetail" }
        consentHistory:
          type: array
          items: { $ref: "#/components/schemas/Consent" }

    DuplicateCandidate:
      type: object
      required: [id, reason, status, personA, personB, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        reason:
          type: string
          enum: [email, phone, name_birth_date]
        status:
          type: string
          enum: [open, merged, not_duplicate]
        personA: { $ref: "#/components/schemas/Person" }
        personB: { $ref: "#/components/schemas/Person" }
        createdAt: { type: string, format: date-time }
        version: { type: string }

    DuplicateCandidatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DuplicateCandidate" }
        nextBefore: { type: [string, "null"], format: uuid }

    ResolveDuplicateRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [merge, not_duplicate]
        survivorPersonId:
          type: string
          format: uuid
          description: Required when `resolution` is `merge`; one of the pair.
