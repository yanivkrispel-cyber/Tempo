      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: "Cancel a booking or leave the waitlist (self, or `bookings.manage`)"
      description: "Inside the free-cancellation window the entry returns; later it stays used and `lateCancel` is true. `returnEntry` (staff only) returns it anyway. Allowed in restricted mode."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelBookingRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationId}/bookings/{bookingId}/move:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [Bookings]
      operationId: moveBooking
      summary: "Move a booked place to another class (`bookings.manage`)"
      description: |
        The entry moves with the place: nothing is spent or returned. The old row becomes `cancelled` with
        `cancelReason: moved` (never a late cancel) and the old class promotes its waitlist. A full target answers
        409 `session.full` (a move never joins a waitlist); a pass that does not cover the target answers 409
        `booking.no_valid_pass`; a place that is not `booked` answers 409 `booking.not_cancellable`. Returns the
        **new** booking. The member gets an inbox item of kind `booking.moved`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveBookingRequest" }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Restricted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

