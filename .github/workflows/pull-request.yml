name: Pull Request

on:
  pull_request:
    # main is the only long-lived branch; every change reaches it through a PR.
    branches: [main]
    # Draft PRs do not run CI; marking a draft ready for review runs it.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # dorny/paths-filter lists the PR's changed files through the GitHub API.
  pull-requests: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

# The five job names are the required checks on main: never rename them. Each job
# always runs and reports success; a paths filter inside the job skips the heavy
# steps when the PR touches nothing they check (a docs-only PR runs only checkout,
# the filters and the secret scan). A job skipped on a draft also counts as success.
jobs:
  backend:
    name: Backend (.NET)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            relevant:
              - 'backend/**'
              - 'tests/**'
              - 'contracts/openapi/**'
              - 'Tempo.sln'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '.editorconfig'
              - '.github/workflows/pull-request.yml'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet restore
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet restore Tempo.sln

      - name: dotnet format (verify, no changes)
        if: steps.changes.outputs.relevant == 'true'
        # Layer 1 (ADR-0025). The checkout is LF, as .editorconfig requires; on a Windows
        # checkout with core.autocrlf run it in the sdk:10.0 container instead.
        run: dotnet format Tempo.sln --verify-no-changes --no-restore

      - name: dotnet build
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet build Tempo.sln --configuration Release --no-restore

      - name: dotnet test
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet test Tempo.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Publish the Lambda packages as deploy-development.yml does
        if: steps.changes.outputs.relevant == 'true'
        # The deploy publishes for linux-arm64 with ReadyToRun (perf audit 2026-10-20); a csproj change that breaks
        # that publish should fail here, not on main.
        run: |
          for project in Tempo.Api Tempo.Worker; do
            dotnet publish "backend/$project/$project.csproj" --configuration Release --runtime linux-arm64 --self-contained false
            test -f "backend/$project/bin/Release/net10.0/linux-arm64/publish/$project.runtimeconfig.json"
          done

      - name: Check for vulnerable NuGet packages
        if: steps.changes.outputs.relevant == 'true'
        run: dotnet list Tempo.sln package --vulnerable --include-transitive

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.changes.outputs.relevant == 'true'
        with:
          name: dotnet-test-results
          path: TestResults

  infrastructure:
    name: Infrastructure (CDK)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            relevant:
              - 'infrastructure/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/pull-request.yml'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.relevant == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: pnpm install
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Type-check infrastructure
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm --filter @tempo/infrastructure run build

      - name: CDK unit tests
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm --filter @tempo/infrastructure test

      - name: Tools script tests
        if: steps.changes.outputs.relevant == 'true'
        # The helpers under tools/scripts/lib (demo seed filter, Neon branch drill) use only node:test.
        run: node --test tools/scripts/lib/*.test.mjs

      - name: cdk synth (dev, staging, production configuration)
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm --filter @tempo/infrastructure run synth

      - name: cdk diff (informational - no AWS credentials on pull_request)
        if: steps.changes.outputs.relevant == 'true'
        run: echo "cdk diff requires AWS credentials; it runs against the real account only in deploy-development.yml."

  frontend:
    name: Frontend workspaces
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            relevant:
              - 'apps/**'
              - 'packages/**'
              - 'tests/e2e/**'
              - 'contracts/openapi/**'
              - 'infrastructure/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'tsconfig*.json'
              - '.github/workflows/pull-request.yml'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.relevant == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: pnpm install
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high and critical)
        if: steps.changes.outputs.relevant == 'true'
        # Layer 1 (ADR-0025). Accepted advisories live in pnpm-workspace.yaml
        # (auditConfig.ignoreGhsas), each with the issue that removes it.
        run: pnpm audit --audit-level high

      - name: API client matches the OpenAPI contract
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm --filter @tempo/api-client run check:generated

      - name: Build and test frontend workspaces
        if: steps.changes.outputs.relevant == 'true'
        # apps/* (Vite build + Vitest), packages/* (design-system token check,
        # api-client type check + Vitest)
        # and infrastructure. pnpm --recursive skips packages without the script.
        run: |
          pnpm --recursive run build
          pnpm --recursive run test

      - name: Lint frontend workspaces
        if: steps.changes.outputs.relevant == 'true'
        # Each workspace owns its "lint" script (type check, eslint, token check),
        # so adding a linter to a workspace never needs a workflow change.
        run: pnpm --recursive --if-present run lint

  contracts:
    name: Contract validation
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            relevant:
              - 'contracts/**'
              - '.github/workflows/pull-request.yml'

      - name: Validate OpenAPI specs (if any exist yet)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          shopt -s nullglob
          files=(contracts/openapi/*.yaml contracts/openapi/*.yml contracts/openapi/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No OpenAPI files yet - nothing to validate."
            exit 0
          fi
          npx --yes @redocly/cli@latest lint "${files[@]}"

      - name: Validate event schemas (if any exist yet)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          shopt -s nullglob
          files=(contracts/schemas/*.json contracts/events/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No event/schema files yet - nothing to validate."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Validating $f is well-formed JSON"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

  security:
    name: Security scans
    # No paths filter: a secret can land in any file, docs included.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits through the GitHub API; with
      # contents: read alone that call fails with "Resource not accessible by integration".
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static analysis (Semgrep OSS, new findings only)
        # Layer 1 (ADR-0025). Only findings that this PR adds fail the job:
        # --baseline-commit compares with the PR's base. Known ones are in #115.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm -e BASE_SHA -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0 sh -c \
            'git config --global --add safe.directory /src && semgrep scan --config p/default --metrics=off --error --baseline-commit "$BASE_SHA"'
