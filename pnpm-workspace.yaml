packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "infrastructure"
# esbuild's install script only verifies the platform binary that pnpm already
# installs from esbuild's optionalDependencies, so it is not needed.
allowBuilds:
  esbuild: false
# Supply chain (#115, W-3): a version must be a day old before it installs (pnpm 11's default, written down), and
# a dependency of a dependency may not come from a git URL or a tarball. `trustPolicy: no-downgrade` is left out:
# with it the frozen install fails on semver@6.3.1 and undici-types@6.20.0 (trust downgrade), which needs a
# person's look before anything is excluded.
minimumReleaseAge: 1440
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  - aws-cdk-lib@2.262.2
  - aws-cdk@2.1134.0
  - constructs@10.8.0
# `pnpm audit --audit-level high` runs in CI (ADR-0025). Each ignored advisory
# names the issue that removes it; nothing else goes here.
auditConfig:
  ignoreGhsas: []
