version: "3.9"

services:
  postgres:
    image: postgres:18-alpine
    # #115: no process in the container may gain privileges (setuid). The filesystem stays writable for the data.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD: tempo
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker and
      # refuse a mount at .../data. A volume left from PostgreSQL 17 must be
      # removed first: docker compose -f docker-compose.local.yml down -v
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempo"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    security_opt:
      - no-new-privileges:true
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

volumes:
  postgres_data:
